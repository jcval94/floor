[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floor"
version = "0.1.0"
description = "Probabilistic floor/ceiling forecasting and signal engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "numpy>=2.0,<3",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.16.4",
  "scikit-learn==1.8.0",
]
modeling = ["numpy>=2.0,<3", "scikit-learn==1.8.0"]

[project.scripts]
floor = "floor.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff.lint]
# Keep CI focused on deterministic correctness errors. Broader style/specialty
# rule families can be enabled incrementally without making dependency upgrades
# rewrite the repository-wide lint contract.
select = ["E4", "E7", "E9", "F"]
