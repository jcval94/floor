version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-development:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "ruff"
          - "scikit-learn"
    ignore:
      # CI installs the newest NumPy allowed by pyproject. Dependabot currently
      # mis-handles the duplicated lower-bound requirement across dev/modeling
      # extras and attempts a no-op 2.2.6 -> 2.2.6 rewrite.
      - dependency-name: "numpy"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
