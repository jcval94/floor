name: walk_forward_oos

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First OOS replay session (YYYY-MM-DD)"
        required: true
        default: "2026-03-02"
      end:
        description: "Last OOS replay session (YYYY-MM-DD)"
        required: true
        default: "2026-09-04"
      fold_sessions:
        description: "Trading sessions per frozen-model fold"
        required: true
        default: "21"
      yahoo_range:
        description: "Yahoo daily history used to rebuild the modelable dataset"
        required: true
        default: "3y"
  push:
    branches: [main]
    paths:
      - walk_forward_request.json

permissions:
  contents: write
  actions: write

concurrency:
  group: walk-forward-oos
  cancel-in-progress: false

jobs:
  walk_forward:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Resolve walk-forward request
        id: window
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ github.event.inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ github.event.inputs.end }}" >> "$GITHUB_OUTPUT"
            echo "fold_sessions=${{ github.event.inputs.fold_sessions }}" >> "$GITHUB_OUTPUT"
            echo "yahoo_range=${{ github.event.inputs.yahoo_range }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          payload = json.load(open('walk_forward_request.json', encoding='utf-8'))
          print(f"start={payload['start']}")
          print(f"end={payload['end']}")
          print(f"fold_sessions={payload['fold_sessions']}")
          print("yahoo_range=3y")
          PY
          fi

      - name: Freeze guard
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m league.freeze \
            --league-config config/strategy_league.json \
            --freeze config/frozen/capital_challenger_v1.json

      - name: Initialize isolated market DB
        run: |
          set -euo pipefail
          rm -rf data/market
          mkdir -p data/market
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from storage.market_db import init_market_db
          init_market_db(Path("data/market/market_data.sqlite"))
          print("isolated market DB initialized")
          PY

      - name: Refresh daily market history from Yahoo
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range "${{ steps.window.outputs.yahoo_range }}" \
            --interval "1d" \
            --sleep-seconds 0.4

      - name: Validate market coverage
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol 300 \
            --max-age-days 7

      - name: Build leakage-safe modelable dataset
        run: |
          set -euo pipefail
          mkdir -p data/training
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --output data/training/walk_forward_market_rows.jsonl
          PYTHONPATH=src python -m features.run_features \
            --input data/training/walk_forward_market_rows.jsonl \
            --output data/training/walk_forward_modelable_dataset.json

      - name: Run frozen-config walk-forward with per-fold retraining
        run: |
          set -euo pipefail
          out="data/replay/walk_forward_oos_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          PYTHONPATH=src python -m replay.walk_forward_oos \
            --dataset data/training/walk_forward_modelable_dataset.json \
            --market-db data/market/market_data.sqlite \
            --output "$out" \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --fold-sessions "${{ steps.window.outputs.fold_sessions }}" \
            --freeze config/frozen/capital_challenger_v1.json \
            | tee "$RUNNER_TEMP/walk_forward_summary.json"

      - name: Validate OOS evidence contract
        run: |
          set -euo pipefail
          out="data/replay/walk_forward_oos_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          python - "$out/walk_forward_oos.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload['status'] == 'MODEL_OOS_OK'
          assert payload['historical_model_out_of_sample'] is True
          assert payload['future_market_data_used'] is False
          assert payload['model_training_future_data_used'] is False
          assert payload['prospective_evidence'] is False
          assert payload['strategy_configuration_selected_retrospectively'] is True
          rows = payload['rows']
          assert len(rows) == 7, len(rows)
          assert any(row['strategy'] == 'capital_allocation_challenger' for row in rows)
          assert payload['folds'] >= 2
          for fold in payload['fold_reports']:
              cutoff = fold['training_cutoff']
              assert cutoff['training_observation_before_fold'] is True
              assert cutoff['training_target_maturity_before_fold'] is True
          print(json.dumps({
              'status': payload['status'],
              'sessions': payload['sessions'],
              'folds': payload['folds'],
              'challenger': payload['challenger'],
          }, indent=2))
          PY

      - name: Publish walk-forward report to runtime state
        run: |
          set -euo pipefail
          out="data/replay/walk_forward_oos_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          mkdir -p data/reports
          cp "$out/walk_forward_oos.json" data/reports/walk_forward_oos.json

      - name: Publish rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh publish

      - name: Trigger audited Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Upload OOS evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: walk-forward-oos-${{ steps.window.outputs.start }}-${{ steps.window.outputs.end }}-${{ github.run_id }}
          path: |
            data/replay/walk_forward_oos_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}
            data/reports/walk_forward_oos.json
          if-no-files-found: error
          retention-days: 30
