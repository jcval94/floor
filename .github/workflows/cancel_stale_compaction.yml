name: cancel-stale-compaction

on:
  push:
    branches: [fix/p1-authoritative-state-writers]
    paths:
      - ".github/workflows/cancel_stale_compaction.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete destructive run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel 35937791334 --repo "${GITHUB_REPOSITORY}"
          echo "cancelled_run=35937791334"
