name: retrain_execute

on:
  push:
    branches: [main]
    paths:
      - 'retrain_execute_request.json'
  workflow_dispatch:
    inputs:
      force:
        description: "Force retrain even if no drift"
        required: false
        default: "false"
      approve_recommended:
        description: "Authorize tasks recommended by the latest governed assessment"
        required: false
        default: "false"
      dataset_path:
        description: "Ephemeral modelable dataset path"
        required: false
        default: "data/training/modelable_dataset.json"
      version:
        description: "Version tag for generated candidates"
        required: false
        default: ""
      tasks:
        description: "Comma-separated tasks"
        required: false
        default: "d1,w1,q1,value,timing"
      confirm_publish:
        description: "Type PUBLISH_CHAMPIONS_TO_MAIN to authorize a manual champion publish"
        required: false
        default: ""
permissions:
  contents: write

jobs:
  retrain_critical:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: floor-runtime-state-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install modeling dependencies
        run: python -m pip install -e '.[modeling]'
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore

      - name: Decide retrain gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          APPROVE_RECOMMENDED: ${{ github.event.inputs.approve_recommended }}
          INPUT_TASKS: ${{ github.event.inputs.tasks }}
          INPUT_DATASET_PATH: ${{ github.event.inputs.dataset_path }}
          CONFIRM_PUBLISH: ${{ github.event.inputs.confirm_publish }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ.get("EVENT_NAME", "")
          force = os.environ.get("FORCE", "false").lower() == "true"
          approve_recommended = (
              os.environ.get("APPROVE_RECOMMENDED", "false").lower() == "true"
          )
          confirmation = os.environ.get("CONFIRM_PUBLISH", "")
          manual_confirmation_missing = (
              event_name != "push"
              and (force or approve_recommended)
              and confirmation != "PUBLISH_CHAMPIONS_TO_MAIN"
          )
          requested = [
              x.strip()
              for x in os.environ.get("INPUT_TASKS", "d1,w1,q1,value,timing").split(",")
              if x.strip()
          ]
          dataset_path = (
              os.environ.get("INPUT_DATASET_PATH", "").strip()
              or "data/training/modelable_dataset.json"
          )

          # A committed request is an auditable manual approval surface for
          # environments that cannot invoke workflow_dispatch. It can only
          # approve the governed recommendation: push requests cannot force
          # arbitrary tasks, versions, or datasets.
          if event_name == "push":
              request_path = Path("retrain_execute_request.json")
              request = (
                  json.loads(request_path.read_text(encoding="utf-8"))
                  if request_path.exists()
                  else {}
              )
              allowed_tasks = {"d1", "w1", "q1", "value", "timing"}
              request_tasks = [
                  str(x).strip()
                  for x in request.get("tasks", [])
                  if str(x).strip()
              ]
              unknown_tasks = sorted(set(request_tasks) - allowed_tasks)
              if unknown_tasks:
                  raise SystemExit(
                      "Committed retrain request contains unsupported tasks: "
                      + ",".join(unknown_tasks)
                  )
              request_force = request.get("force") is True
              request_confirmation = str(request.get("confirm_publish") or "")
              if request_force:
                  if request_confirmation != "PUBLISH_CHAMPIONS_TO_MAIN":
                      raise SystemExit(
                          "Committed manual-force retrain requires "
                          "confirm_publish=PUBLISH_CHAMPIONS_TO_MAIN"
                      )
                  if not request_tasks:
                      raise SystemExit(
                          "Committed manual-force retrain requires explicit tasks"
                      )
                  force = True
                  approve_recommended = False
                  requested = request_tasks
              else:
                  force = False
                  approve_recommended = request.get("approve_recommended") is True
                  requested = []
              dataset_path = "data/training/modelable_dataset.json"
          summary_path = Path("data/training/review_summary_latest.json")
          tasks = []
          reason = (
              "manual_confirmation_required"
              if manual_confirmation_missing
              else "manual_approval_required"
          )
          authorization = "NOT_AUTHORIZED"
          if manual_confirmation_missing:
              force = False
              approve_recommended = False
          if force:
              tasks = requested
              reason = (
                  "audited_committed_manual_force"
                  if event_name == "push"
                  else "manual_force"
              )
              authorization = (
                  "AUDITED_MANUAL_FORCE"
                  if event_name == "push"
                  else "MANUAL_FORCE"
              )
          elif approve_recommended and summary_path.exists():
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              tasks = [
                  str(x).strip()
                  for x in payload.get("tasks_for_auto_retrain_requested", [])
                  if str(x).strip()
              ]
              reason = (
                  (
                      "audited_request_approval_of_recommendation"
                      if event_name == "push"
                      else "manual_approval_of_recommendation"
                  )
                  if tasks
                  else "no_recommended_tasks"
              )
              authorization = "MANUAL_APPROVAL" if tasks else "NOT_REQUIRED"
          elif approve_recommended:
              reason = "missing_governed_summary"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if tasks else 'false'}\n")
              fh.write(f"tasks={','.join(tasks)}\n")
              fh.write(f"reason={reason}\n")
              fh.write(f"authorization={authorization}\n")
              fh.write(f"dataset_path={dataset_path}\n")
          PY

      - name: Record retrain authorization
        if: steps.gate.outputs.run == 'true'
        env:
          TASKS_TO_RUN: ${{ steps.gate.outputs.tasks }}
          AUTHORIZATION: ${{ steps.gate.outputs.authorization }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/training/review_summary_latest.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          control = payload.setdefault("retraining_control", {})
          tasks = [x for x in os.environ["TASKS_TO_RUN"].split(",") if x]
          control.update(
              {
                  "authorization": os.environ["AUTHORIZATION"],
                  "authorized_tasks": tasks,
                  "execution": "AUTHORIZED_PENDING_EXECUTION",
              }
          )
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Initialize DB schemas
        if: steps.gate.outputs.run == 'true'
        run: make init-db-schemas

      - name: Refresh market data and rebuild ephemeral dataset
        if: steps.gate.outputs.run == 'true'
        env:
          DATASET_PATH: ${{ steps.gate.outputs.dataset_path }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range 5y \
            --interval 1d \
            --sleep-seconds 0.4
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --output data/training/yahoo_market_rows.jsonl
          # M3 labels consume 65 future sessions. Reserve 65 purge sessions
          # plus 75/76 usable OOT sessions for validation/test.
          PYTHONPATH=src python -m features.run_features \
            --input data/training/yahoo_market_rows.jsonl \
            --output "$DATASET_PATH" \
            --validation-days 140 \
            --test-days 141

      - name: Retrain selected models
        if: steps.gate.outputs.run == 'true'
        env:
          DATASET_PATH: ${{ steps.gate.outputs.dataset_path }}
          TASKS_TO_RUN: ${{ steps.gate.outputs.tasks }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION_TAG="$VERSION_INPUT"
          [ -n "$VERSION_TAG" ] || VERSION_TAG="$(date -u +%Y%m%dT%H%M%SZ)"
          bash scripts/retrain_models.sh "$DATASET_PATH" data/training "$VERSION_TAG" "$TASKS_TO_RUN" retrain
          for champion in \
            data/training/models/d1_champion.json \
            data/training/models/w1_champion.json \
            data/training/models/q1_champion.json \
            data/training/models/value_champion.json \
            data/training/models/timing_champion.json; do
            test -s "$champion" || { echo "::error::Missing champion: $champion"; exit 1; }
          done

      - name: Validate champion payloads
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          for champion in \
            data/training/models/d1_champion.json \
            data/training/models/w1_champion.json \
            data/training/models/q1_champion.json \
            data/training/models/value_champion.json \
            data/training/models/timing_champion.json; do
            PYTHONPATH=src python -m utils.workflow_validations validate-json-file \
              --path "$champion" \
              --required-fields model_name,version
          done
          sqlite3 data/persistence/app.sqlite "PRAGMA quick_check;" | grep -qx ok

      - name: Commit lightweight model registry only
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/training/models/*.json
          if git diff --cached --quiet; then
            echo "No lightweight model registry changes."
          else
            git commit -m "chore: publish retrained champion registry"
            for attempt in 1 2 3; do
              if git push; then break; fi
              [ "$attempt" -lt 3 ] || exit 1
              git fetch origin "${GITHUB_REF_NAME}"
              # Runtime state may still be tracked in pre-compaction history.
              # Auto-stash keeps those restored operational files out of the rebase.
              git rebase --autostash "origin/${GITHUB_REF_NAME}"
            done
          fi

      - name: Refresh post-retrain review against current champions
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m floor.main review-training
          PYTHONPATH=src python -m floor.training.governance \
            --summary data/training/review_summary_latest.json

      - name: Record completed retrain execution
        if: steps.gate.outputs.run == 'true'
        env:
          TASKS_TO_RUN: ${{ steps.gate.outputs.tasks }}
          AUTHORIZATION: ${{ steps.gate.outputs.authorization }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/training/review_summary_latest.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          control = payload.setdefault("retraining_control", {})
          tasks = [x for x in os.environ["TASKS_TO_RUN"].split(",") if x]
          control["authorization"] = os.environ["AUTHORIZATION"]
          control["authorized_tasks"] = tasks
          control["execution"] = "COMPLETED"
          control["executed_tasks"] = tasks
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish rolling runtime state outside Git
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh publish

      - name: Upload full retraining run as artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retrain-execute-${{ github.run_id }}
          path: |
            data/training
            data/market/market_data.sqlite
            data/persistence/app.sqlite
          if-no-files-found: error
          retention-days: 30

  retrain_info:
    needs: retrain_critical
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          echo "retrain_execute result=${{ needs.retrain_critical.result }}"
          echo "authorization=manual_only"
          echo "git_payload=lightweight_model_json_only"
