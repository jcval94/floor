name: strategy_live

on:
  schedule:
    # Two observations per hour. Half-hour cadence is sufficient for this
    # observational mark-to-market monitor and reduces scheduler pressure.
    # The scheduler watchdog is independently offset and workflow_run-triggered.
    - cron: "5,35 13-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floor-strategy-live-state-writer
  cancel-in-progress: false

jobs:
  live_mark:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Gate to US market hours
        id: market
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from datetime import datetime, time

          from floor.calendar import ET, is_early_close, is_market_session

          now = datetime.now(ET)
          close_time = time(13, 0) if is_early_close(now.date()) else time(16, 0)
          wall = now.time().replace(tzinfo=None)
          active = is_market_session(now.date()) and time(9, 30) <= wall <= close_time
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={'true' if active else 'false'}\n")
              out.write(f"session={now.date().isoformat()}\n")
              out.write(f"now_et={now.isoformat()}\n")
          print(f"strategy_live active={active} now_et={now.isoformat()} close={close_time}")
          PY

      - name: Restore compact official EOD base
        if: steps.market.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/strategy_live_state.sh restore-base

      - name: Validate or refresh authoritative T-1 live base
        id: base
        if: steps.market.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          validate_base() {
            PYTHONPATH=src python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          from floor.calendar import ET, previous_market_session

          path = Path("data/metrics/strategy_league/live_base.json")
          if not path.exists():
              raise SystemExit(1)
          payload = json.loads(path.read_text(encoding="utf-8"))
          cfg = json.loads(Path("config/strategy_league.json").read_text(encoding="utf-8"))
          expected_session = previous_market_session(datetime.now(ET).date()).isoformat()
          valid = (
              payload.get("status") == "READY"
              and str(payload.get("league_id") or "") == str(cfg.get("league_id") or "")
              and str(payload.get("last_eod_session") or "") == expected_session
              and bool(str(payload.get("official_state_hash") or ""))
          )
          print({
              "valid": valid,
              "league_id": payload.get("league_id"),
              "expected_league_id": cfg.get("league_id"),
              "last_eod_session": payload.get("last_eod_session"),
              "expected_last_eod_session": expected_session,
              "has_state_hash": bool(str(payload.get("official_state_hash") or "")),
          })
          raise SystemExit(0 if valid else 1)
          PY
          }

          refreshed=false
          if ! validate_base; then
            echo "::warning::Release-backed live base is stale or belongs to another league epoch; rebuilding from authoritative runtime state."
            rm -f data/metrics/strategy_league/live_base.json
            bash scripts/runtime_state.sh restore
            PYTHONPATH=src python -m league.live_snapshot export-base \
              --data-dir data \
              --league-config config/strategy_league.json \
              --output data/metrics/strategy_league/live_base.json
            refreshed=true
          fi

          if validate_base; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "$refreshed" = "true" ]; then
              bash scripts/strategy_live_state.sh publish-base
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No authoritative T-1 Strategy League base is available; shadow trading stays disabled."
          fi

      - name: Restore previous intraday snapshot
        if: steps.market.outputs.run == 'true' && steps.base.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/strategy_live_state.sh restore-snapshot

      - name: Build live shadow portfolio from T-1 targets
        if: steps.market.outputs.run == 'true' && steps.base.outputs.ready == 'true'
        env:
          LIVE_TRADING_ENABLED: "false"
        run: |
          PYTHONPATH=src python -m league.shadow_portfolio \
            --base data/metrics/strategy_league/live_base.json \
            --previous-snapshot data/metrics/strategy_league/live_snapshot.json \
            --league-config config/strategy_league.json \
            --output data/metrics/strategy_league/live_snapshot.json \
            --range 1d \
            --interval 5m

      - name: Validate shadow portfolio invariants
        if: steps.market.outputs.run == 'true' && steps.base.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/metrics/strategy_league/live_snapshot.json").read_text(encoding="utf-8"))
          if payload.get("live_execution_enabled") is not False:
              raise SystemExit("live trading must remain disabled")
          fills = payload.get("shadow_open_fills") or []
          keys = [row.get("idempotency_key") for row in fills if row.get("idempotency_key")]
          if len(keys) != len(set(keys)):
              raise SystemExit("double shadow fill detected")
          if payload.get("open_fill_status") == "MISSING_OPEN_DATA":
              print("shadow portfolio degraded: missing OPEN data; no invented fills")
          elif payload.get("open_fills_applied") is not True:
              raise SystemExit("shadow OPEN fills were not applied")
          print(json.dumps({
              "status": payload.get("status"),
              "fills": len(fills),
              "exits": len(payload.get("shadow_exits") or []),
              "observations": len(payload.get("observations") or []),
          }, sort_keys=True))
          PY

      - name: Publish compact intraday snapshot
        if: steps.market.outputs.run == 'true' && steps.base.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/strategy_live_state.sh publish-snapshot

      - name: Upload immutable intraday evidence
        if: steps.market.outputs.run == 'true' && steps.base.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-live-${{ github.run_id }}
          path: data/metrics/strategy_league/live_snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Report closed-market skip
        if: steps.market.outputs.run != 'true'
        run: |
          echo "Strategy live mark skipped outside US market hours."
          echo "now_et=${{ steps.market.outputs.now_et }}"
          echo "session=${{ steps.market.outputs.session }}"

