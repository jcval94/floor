name: model_schema_repair

on:
  push:
    branches:
      - feat/point-in-time-replay
    paths:
      - model_repair_request.json

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/point-in-time-replay
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Resolve repair request
        id: request
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          payload = json.load(open("model_repair_request.json", encoding="utf-8"))
          print(f"cutoff={payload['cutoff']}")
          print(f"version={payload['version']}")
          PY

      - name: Build schema-v2 champions from physically cutoff market data
        run: |
          set -euo pipefail
          rm -rf data/training/schema2_repair_stage
          PYTHONPATH=src python -m replay.cutoff_training \
            --cutoff "${{ steps.request.outputs.cutoff }}" \
            --version "${{ steps.request.outputs.version }}" \
            --output-root data/training/schema2_repair_stage \
            | tee data/training/schema2_repair_build.log

      - name: Validate generated registry with live serving contract
        run: |
          PYTHONPATH=src python -m utils.model_artifact_guard \
            --registry data/training/schema2_repair_stage/models

      - name: Promote generated artifacts only inside repair branch
        run: |
          set -euo pipefail
          stage=data/training/schema2_repair_stage
          mkdir -p data/training/models data/training/models_file data/training/metrics
          for task in d1 w1 q1 value timing; do
            cp "$stage/models/${task}_champion.json" "data/training/models/${task}_champion.json"
            cp "$stage/models_file/${task}_champion.pkl" "data/training/models_file/${task}_champion.pkl"
            cp "$stage/models_file/${task}_champion.manifest.json" "data/training/models_file/${task}_champion.manifest.json"
          done
          cp "$stage/schema2_repair_manifest.json" data/training/metrics/schema2_repair_latest.json

      - name: Validate canonical paths after promotion
        run: |
          PYTHONPATH=src python -m utils.model_artifact_guard \
            --registry data/training/models

      - name: Verify replay window was not admitted to training
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("data/training/metrics/schema2_repair_latest.json", encoding="utf-8"))
          assert payload["training_cutoff"] == "2026-08-21"
          assert payload["replay_window_start"] == "2026-08-24"
          assert payload["future_replay_rows_used_for_training"] is False
          assert payload["source"]["max_source_session"] <= payload["training_cutoff"]
          assert payload["full_universe_serving_smoke"]["blocked"] == 0
          assert payload["full_universe_serving_smoke"]["forecasts"] == payload["universe_size"]
          print(json.dumps({
              "training_cutoff": payload["training_cutoff"],
              "dataset_rows": payload["dataset_rows"],
              "forecast_smoke": payload["full_universe_serving_smoke"],
          }, indent=2))
          PY

      - name: Commit validated artifacts to repair branch
        env:
          BRANCH: feat/point-in-time-replay
        run: |
          set -euo pipefail
          rm -rf data/training/schema2_repair_stage data/training/schema2_repair_build.log
          git config user.name "floor-repair-bot"
          git config user.email "floor-repair-bot@users.noreply.github.com"
          git add \
            data/training/models/d1_champion.json \
            data/training/models/w1_champion.json \
            data/training/models/q1_champion.json \
            data/training/models/value_champion.json \
            data/training/models/timing_champion.json \
            data/training/models_file/d1_champion.pkl \
            data/training/models_file/w1_champion.pkl \
            data/training/models_file/q1_champion.pkl \
            data/training/models_file/value_champion.pkl \
            data/training/models_file/timing_champion.pkl \
            data/training/models_file/d1_champion.manifest.json \
            data/training/models_file/w1_champion.manifest.json \
            data/training/models_file/q1_champion.manifest.json \
            data/training/models_file/value_champion.manifest.json \
            data/training/models_file/timing_champion.manifest.json \
            data/training/metrics/schema2_repair_latest.json
          git diff --cached --quiet && { echo "::error::Repair produced no artifact changes"; exit 1; }
          git commit -m "fix: regenerate serving-compatible schema-v2 champions"
          git push origin "HEAD:$BRANCH"
