name: capital_challenger_tournament

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First replay session (YYYY-MM-DD)"
        required: true
        default: "2026-06-22"
      end:
        description: "Last replay session (YYYY-MM-DD)"
        required: true
        default: "2026-09-23"
  push:
    branches:
      - main
    paths:
      - capital_tournament_request.json

permissions:
  contents: write

concurrency:
  group: floor-research-state-writer
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Restore frozen runtime artifacts locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore

      - name: Restore durable research evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/research_state.sh restore

      - name: Verify frozen challenger contract
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m league.freeze \
            --league-config config/strategy_league.json \
            --freeze config/frozen/capital_challenger_v1_v7.json

      - name: Preflight replay artifacts
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m utils.model_artifact_guard \
            --registry data/training/models
          artifact="$(python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/strategy_league.json").read_text(encoding="utf-8"))
          print(config["weekly_model_path"])
          PY
          )"
          test -s "$artifact" || { echo "::error::Missing tournament artifact: $artifact"; exit 1; }
          if head -c 120 "$artifact" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "::error::Tournament artifact is an unresolved LFS pointer: $artifact"
            exit 1
          fi

      - name: Resolve tournament window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ github.event.inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ github.event.inputs.end }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          payload = json.load(open("capital_tournament_request.json", encoding="utf-8"))
          print(f"start={payload['start']}")
          print(f"end={payload['end']}")
          PY
          fi

      - name: Run point-in-time capital tournament
        run: |
          set -euo pipefail
          out="data/replay/capital_tournament_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          PYTHONPATH=src python -m replay.capital_tournament \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --output "$out" | tee "$RUNNER_TEMP/tournament_stdout.json"

      - name: Assert challenger was evaluated without future market data
        run: |
          set -euo pipefail
          out="data/replay/capital_tournament_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          python - "$out/capital_tournament.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["prospective_evidence"] is False
          assert payload["future_data_used"] is False
          rows = payload["leaderboard"]["rows"]
          by_id = {row["strategy"]: row for row in rows}
          expected = {
              "weekly_opportunity_ridge",
              "breakout_protected_by_floor",
              "mean_reversion_floor_w1",
              "cross_horizon_asymmetry",
              "capital_allocation_challenger",
              "benchmark_spy",
              "benchmark_equal_weight",
          }
          missing = sorted(expected - set(by_id))
          assert not missing, f"missing tournament members: {missing}"
          challenger = by_id["capital_allocation_challenger"]
          bases = [
              by_id["weekly_opportunity_ridge"],
              by_id["breakout_protected_by_floor"],
              by_id["mean_reversion_floor_w1"],
              by_id["cross_horizon_asymmetry"],
          ]
          print(json.dumps({
              "challenger": challenger,
              "best_base_return": max(row["return"] for row in bases),
              "challenger_best_existing_strategy": (
                  challenger["return"] > max(row["return"] for row in bases)
              ),
          }, indent=2))
          PY

      - name: Build public retrospective strategy report and attribution
        run: |
          set -euo pipefail
          out="data/replay/capital_tournament_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          league_id="$(python - "$out/capital_tournament.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(payload["league_id"])
          PY
          )"
          PYTHONPATH=src python -m replay.publish_tournament_report \
            --input "$out/capital_tournament.json" \
            --output data/reports/strategy.json
          PYTHONPATH=src python -m league.attribution \
            --history "$out/runs/$league_id/history.jsonl" \
            --output data/reports/strategy_attribution.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/reports/strategy.json").read_text(encoding="utf-8"))
          attribution = json.loads(Path("data/reports/strategy_attribution.json").read_text(encoding="utf-8"))
          assert report["status"] == "RETROSPECTIVE_OK"
          assert report["prospective_evidence"] is False
          assert report["future_data_used"] is False
          assert len(report["rows"]) == 7
          assert report["equity_curve"]
          assert attribution["member"] == "capital_allocation_challenger"
          print(json.dumps({"summary": report["summary"], "attribution": attribution.get("summary")}, indent=2))
          PY

      - name: Publish durable research evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/research_state.sh publish

      - name: Upload tournament evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capital-tournament-${{ steps.window.outputs.start }}-${{ steps.window.outputs.end }}-${{ github.run_id }}
          path: |
            data/replay/capital_tournament_${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}
            data/reports/strategy.json
            data/reports/strategy_attribution.json
          if-no-files-found: error
          retention-days: 30
