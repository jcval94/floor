name: eod

on:
  schedule:
    # Avoid top-of-hour scheduler congestion while retaining four close backstops/hour.
    - cron: "7,22,37,52 20-23 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
      event: ${{ steps.guard.outputs.event }}
      session_day: ${{ steps.guard.outputs.session_day }}
      checkpoint_at: ${{ steps.guard.outputs.checkpoint_at }}
      lateness_minutes: ${{ steps.guard.outputs.lateness_minutes }}
      required_market_session: ${{ steps.guard.outputs.required_market_session }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore lightweight checkpoint state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checkpoint_state.sh restore
      - name: Detect due close
        id: guard
        run: PYTHONPATH=src python -m utils.workflow_guards check --kind eod --tolerance-minutes 360 --data-dir data

  eod_critical:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: floor-runtime-state-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -e . "numpy>=2.0,<3"
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore
      - name: Revalidate immutable close context under writer lock
        id: lock_guard
        run: |
          PYTHONPATH=src python -m utils.workflow_guards validate-context \
            --kind eod \
            --event CLOSE \
            --session-day "${{ needs.gate.outputs.session_day }}" \
            --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
            --data-dir data

      - name: Preflight serving-compatible schema-v2 champions
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m utils.model_artifact_guard \
            --registry data/training/models

      - name: Initialize DB schemas and repair cache only if absent
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          needs_hydration=false
          if [ ! -s data/persistence/app.sqlite ]; then
            needs_hydration=true
          fi
          make init-db-schemas
          if [ "$needs_hydration" = "true" ]; then
            echo "Persistence cache missing; rebuilding once from durable JSONL ledgers."
            PYTHONPATH=src python -m floor.persistence_hydration --data-dir data
          else
            echo "Persistence cache restored and healthy; full ledger replay skipped."
          fi

      - name: Refresh only recent daily market bars
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --range 5d \
            --interval 1d \
            --sleep-seconds 0.15

      - name: Validate accepted close market session
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          symbols=$(PYTHONPATH=src python -c "from pathlib import Path; from floor.universe import parse_universe_yaml; print(','.join(sorted(set(parse_universe_yaml(Path('config/universe.yaml')) + ['SPY']))))")
          PYTHONPATH=src python -m utils.market_data_guard \
            --db data/market/market_data.sqlite \
            --symbols "$symbols" \
            --max-stale-sessions 0 \
            --required-session "${{ needs.gate.outputs.required_market_session }}"

      - name: Validate frozen Weekly challenger
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("config/strategy_league.json").read_text(encoding="utf-8"))["weekly_model_path"])
          PY
          )
          test -s "$MODEL" || {
            echo "::error::Frozen Weekly challenger is missing. EOD refuses to retrain or replace a frozen experiment artifact."
            exit 1
          }
          if head -c 120 "$MODEL" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "::error::Frozen Weekly challenger is an unresolved LFS pointer: $MODEL"
            exit 1
          fi
          python - "$MODEL" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          model_path = Path(sys.argv[1])
          artifact = json.loads(model_path.read_text(encoding="utf-8"))
          params = artifact.get("params", {})
          if params.get("canonical_serving_enabled") is not False:
              raise SystemExit("Frozen Weekly challenger must keep canonical_serving_enabled=false")

          league_cfg = json.loads(Path("config/strategy_league.json").read_text(encoding="utf-8"))
          league_id = str(league_cfg["league_id"])
          actual_sha = hashlib.sha256(model_path.read_bytes()).hexdigest()
          state_path = Path("data/metrics/strategy_league/runs") / league_id / "state.json"
          expected_sha = None
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              expected_sha = str(state.get("frozen_contract", {}).get("weekly_model_sha256") or "")
              if not expected_sha:
                  raise SystemExit(f"Existing league state lacks weekly_model_sha256: {state_path}")
              if actual_sha != expected_sha:
                  raise SystemExit(
                      "Frozen Weekly challenger hash changed; create a new league_id instead of rewriting history "
                      f"expected={expected_sha} actual={actual_sha}"
                  )
          print(json.dumps({
              "status": "FROZEN_WEEKLY_OK",
              "league_id": league_id,
              "model_name": artifact.get("model_name"),
              "version": artifact.get("version"),
              "sha256": actual_sha,
              "checked_against_existing_genesis": expected_sha is not None,
          }, indent=2))
          PY

      - name: Generate canonical close forecast from refreshed daily bar
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m floor.main run-cycle \
            --event CLOSE \
            --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
            --required-market-session "${{ needs.gate.outputs.required_market_session }}"

      # Reconciliation has one owner: EOD. The canonical forecast cycle deliberately
      # does not reconcile, preventing duplicate historical scans at close.
      - name: Reconcile matured predictions against realized bars
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m floor.main reconcile-predictions

      - name: Build site snapshot
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m floor.main build-site

      - name: Update prospective Strategy League
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m league.run_eod \
            --data-dir data \
            --league-config config/strategy_league.json \
            --strategies-config config/strategies.yaml \
            --universe config/universe.yaml

      - name: Build experiment observation snapshot
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m league.experiment_observation --data-dir data --league-config config/strategy_league.json

      - name: Mark run
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m utils.workflow_guards mark \
            --kind eod \
            --event CLOSE \
            --session-day "${{ needs.gate.outputs.session_day }}" \
            --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
            --data-dir data
      - name: Publish rolling runtime state outside Git
        if: steps.lock_guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_STATE_CHECKPOINT_AT: ${{ needs.gate.outputs.checkpoint_at }}
          RUNTIME_STATE_CHECKPOINT_EVENT: CLOSE
        run: bash scripts/runtime_state.sh publish
      - name: Publish lightweight checkpoint index
        if: steps.lock_guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checkpoint_state.sh publish

      - name: Repair lightweight checkpoint index after duplicate suppression
        if: steps.lock_guard.outputs.run != 'true' && steps.lock_guard.outputs.reason == 'already_ran'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checkpoint_state.sh publish

      - name: Upload immutable EOD audit artifact
        if: steps.lock_guard.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eod-audit-${{ github.run_id }}
          path: |
            data/reports
            data/snapshots
            data/metrics
          if-no-files-found: warn
          retention-days: 30
      - name: Upload compact Strategy League audit
        if: steps.lock_guard.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-league-${{ github.run_id }}
          path: |
            data/metrics/strategy_league/leaderboard.json
            data/metrics/strategy_league/status.json
            data/metrics/strategy_league/experiment_observation.json
            data/metrics/strategy_league/experiment_observation_history.jsonl
            data/metrics/strategy_league/models/**/*.json
            data/metrics/strategy_league/runs/*/history.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Report duplicate EOD suppression
        if: steps.lock_guard.outputs.run != 'true'
        run: |
          echo "EOD suppressed after lock revalidation."
          echo "reason=${{ steps.lock_guard.outputs.reason }}"
          echo "checkpoint_at=${{ steps.lock_guard.outputs.checkpoint_at }}"
          echo "required_market_session=${{ steps.lock_guard.outputs.required_market_session }}"

  eod_info:
    needs: [gate, eod_critical]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          echo "eod run=${{ needs.gate.outputs.run }} reason=${{ needs.gate.outputs.reason }}"
          echo "checkpoint_at=${{ needs.gate.outputs.checkpoint_at }}"
          echo "lateness_minutes=${{ needs.gate.outputs.lateness_minutes }}"
          echo "polling=15-minute-lightweight-close-backstops"
          echo "checkpoint_state=github_release:checkpoint-state-v1"
          echo "git_operational_writes=disabled"
          if [ "${{ needs.gate.outputs.reason }}" = "close_window_missed" ]; then
            echo "::error::EOD did not complete inside the allowed catch-up window."
            exit 1
          fi
