name: eod

on:
  schedule:
    # Poll hourly after the earliest possible US close. The guard is idempotent,
    # so these are cheap backstops that tolerate delayed/dropped scheduled runs.
    - cron: "15 20-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
      event: ${{ steps.guard.outputs.event }}
      checkpoint_at: ${{ steps.guard.outputs.checkpoint_at }}
      lateness_minutes: ${{ steps.guard.outputs.lateness_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore
      - name: Detect due close
        id: guard
        run: PYTHONPATH=src python -m utils.workflow_guards check --kind eod --tolerance-minutes 360 --data-dir data

  eod_critical:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: floor-runtime-state-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore
      - name: Revalidate close under writer lock
        id: lock_guard
        run: PYTHONPATH=src python -m utils.workflow_guards check --kind eod --tolerance-minutes 360 --data-dir data
      - name: Initialize DBs
        if: steps.lock_guard.outputs.run == 'true'
        run: make init-dbs

      - name: Refresh only recent daily market bars
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --range 5d \
            --interval 1d \
            --sleep-seconds 0.15

      - name: Ensure frozen Weekly challenger exists
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          MODEL=data/metrics/strategy_league/models/weekly_opportunity_challenger.json
          if [ -s "$MODEL" ]; then
            echo "Frozen Weekly challenger already exists; bootstrap skipped."
            exit 0
          fi

          echo "Weekly challenger missing; bootstrapping once from retained local history."
          if ! PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol 80 \
            --max-age-days 7; then
            echo "Local retained history is insufficient; performing one-time 2y bootstrap refresh."
            PYTHONPATH=src python -m storage.yahoo_ingest \
              --db data/market/market_data.sqlite \
              --universe config/universe.yaml \
              --benchmark SPY \
              --range 2y \
              --interval 1d \
              --sleep-seconds 0.2
          fi

          mkdir -p data/metrics/strategy_league/bootstrap
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --output data/metrics/strategy_league/bootstrap/market_rows.jsonl
          PYTHONPATH=src python -m features.run_features \
            --input data/metrics/strategy_league/bootstrap/market_rows.jsonl \
            --output data/metrics/strategy_league/bootstrap/modelable_dataset.json
          VERSION="league-$(date -u +%Y%m%dT%H%M%SZ)"
          PYTHONPATH=src python -m league.bootstrap_weekly_model \
            --dataset data/metrics/strategy_league/bootstrap/modelable_dataset.json \
            --output "$MODEL" \
            --version "$VERSION"
          rm -rf data/metrics/strategy_league/bootstrap

      - name: Reconcile matured predictions against realized bars
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m floor.main reconcile-predictions

      - name: Build site snapshot
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m floor.main build-site

      - name: Update prospective Strategy League
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m league.run_eod \
            --data-dir data \
            --league-config config/strategy_league.json \
            --strategies-config config/strategies.yaml \
            --universe config/universe.yaml

      - name: Build experiment observation snapshot
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m league.experiment_observation --data-dir data

      - name: Mark run
        if: steps.lock_guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m utils.workflow_guards mark --kind eod --event CLOSE --data-dir data
      - name: Publish rolling runtime state outside Git
        if: steps.lock_guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh publish
      - name: Upload immutable EOD audit artifact
        if: steps.lock_guard.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eod-audit-${{ github.run_id }}
          path: |
            data/reports
            data/snapshots
            data/metrics
          if-no-files-found: warn
          retention-days: 30
      - name: Upload compact Strategy League audit
        if: steps.lock_guard.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-league-${{ github.run_id }}
          path: |
            data/metrics/strategy_league/leaderboard.json
            data/metrics/strategy_league/status.json
            data/metrics/strategy_league/experiment_observation.json
            data/metrics/strategy_league/experiment_observation_history.jsonl
            data/metrics/strategy_league/models/weekly_opportunity_challenger.json
            data/metrics/strategy_league/runs/*/history.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Report duplicate/stale EOD suppression
        if: steps.lock_guard.outputs.run != 'true'
        run: |
          echo "EOD suppressed after lock revalidation."
          echo "reason=${{ steps.lock_guard.outputs.reason }}"
          echo "checkpoint_at=${{ steps.lock_guard.outputs.checkpoint_at }}"
          echo "lateness_minutes=${{ steps.lock_guard.outputs.lateness_minutes }}"

      - name: Fail if close expired while waiting for the writer lock
        if: steps.lock_guard.outputs.reason == 'close_window_missed'
        run: |
          echo "::error::The EOD close window expired before the evidence loop could run."
          exit 1

  eod_info:
    needs: [gate, eod_critical]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          echo "eod run=${{ needs.gate.outputs.run }} reason=${{ needs.gate.outputs.reason }}"
          echo "checkpoint_at=${{ needs.gate.outputs.checkpoint_at }}"
          echo "lateness_minutes=${{ needs.gate.outputs.lateness_minutes }}"
          echo "polling=hourly-close-backstops"
          echo "git_operational_writes=disabled"
          if [ "${{ needs.gate.outputs.reason }}" = "close_window_missed" ]; then
            echo "::error::EOD did not complete inside the allowed catch-up window."
            exit 1
          fi
