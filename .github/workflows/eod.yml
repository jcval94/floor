name: eod

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
      event: ${{ steps.guard.outputs.event }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore
      - name: Detect close window
        id: guard
        run: PYTHONPATH=src python -m utils.workflow_guards check --kind eod --tolerance-minutes 25 --data-dir data

  eod_critical:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: floor-runtime-state-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore
      - name: Initialize DBs
        run: make init-dbs
      - name: Build site snapshot
        run: PYTHONPATH=src python -m floor.main build-site
      - name: Mark run
        run: PYTHONPATH=src python -m utils.workflow_guards mark --kind eod --event CLOSE --data-dir data
      - name: Publish rolling runtime state outside Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh publish
      - name: Upload immutable EOD audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eod-audit-${{ github.run_id }}
          path: |
            data/reports
            data/snapshots
            data/metrics
          if-no-files-found: warn
          retention-days: 30

  eod_info:
    needs: [gate, eod_critical]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          echo "eod run=${{ needs.gate.outputs.run }} reason=${{ needs.gate.outputs.reason }}"
          echo "git_operational_writes=disabled"
