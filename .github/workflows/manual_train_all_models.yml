name: manual_train_all_models

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for model artifacts (optional, UTC timestamp if empty)"
        required: false
        default: ""
      yahoo_range:
        description: "Yahoo range for market refresh"
        required: false
        default: "5y"
      yahoo_interval:
        description: "Yahoo interval for market refresh"
        required: false
        default: "1d"
      min_rows:
        description: "Minimum ABT rows required before training"
        required: false
        default: "800"
      min_columns:
        description: "Minimum ABT variables in final_model_columns"
        required: false
        default: "45"
      commit_champions:
        description: "Commit lightweight champion/competition JSON only (never DBs, datasets, PKLs or logs)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: manual-train-all-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train_all_models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install modeling dependencies
        run: python -m pip install -e '.[modeling]'

      - name: Resolve run metadata
        id: runmeta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION_TAG="$VERSION_INPUT"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          LOG_FILE="data/training/manual_train_all_models_${VERSION_TAG}.log"
          CSV_FILE="data/training/models/horizon_training_results_${VERSION_TAG}.csv"
          mkdir -p data/training data/training/models
          touch "$LOG_FILE"
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"
          echo "csv_file=$CSV_FILE" >> "$GITHUB_OUTPUT"

      - name: Initialize DBs
        run: make init-dbs | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Refresh market DB from Yahoo
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range "${{ inputs.yahoo_range }}" \
            --interval "${{ inputs.yahoo_interval }}" \
            --sleep-seconds 0.4 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Validate market universe coverage
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol 60 \
            --max-age-days 7 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Build ABT base rows from SQLite
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --output data/training/yahoo_market_rows.jsonl 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Build leakage-safe ABT modelable dataset
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m features.run_features \
            --input data/training/yahoo_market_rows.jsonl \
            --output data/training/modelable_dataset.json \
            --validation-days 75 \
            --test-days 76 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Validate ABT quality and P0 integrity metadata
        env:
          MIN_ROWS: ${{ inputs.min_rows }}
          MIN_COLUMNS: ${{ inputs.min_columns }}
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"
          import json
          import os
          from pathlib import Path

          path = Path("data/training/modelable_dataset.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          rows = payload.get("rows", [])
          columns = payload.get("final_model_columns", [])
          min_rows = int(os.environ.get("MIN_ROWS", "800"))
          min_columns = int(os.environ.get("MIN_COLUMNS", "45"))
          required_columns = {
              "close", "atr_14", "trend_context_m3", "drawdown_13w",
              "floor_d1", "ceiling_d1", "floor_w1", "ceiling_w1",
              "floor_q1", "ceiling_q1", "floor_m3", "floor_delta_m3",
              "floor_week_m3", "split", "split_eligible_d1",
              "split_eligible_w1", "split_eligible_q1", "split_eligible_m3",
              "target_end_date_d1", "target_end_date_w1",
              "target_end_date_q1", "target_end_date_m3",
          }
          missing = sorted(required_columns.difference(columns))
          if len(rows) < min_rows:
              raise SystemExit(f"ABT rows below threshold: {len(rows)} < {min_rows}")
          if len(columns) < min_columns:
              raise SystemExit(f"ABT columns below threshold: {len(columns)} < {min_columns}")
          if missing:
              raise SystemExit(f"ABT missing P0 integrity variables: {missing}")
          if not any(
              row.get("split") == "validation" and row.get("split_eligible_m3")
              for row in rows
          ):
              raise SystemExit("ABT has no leakage-safe m3 validation rows")
          print(f"ABT OK rows={len(rows)} columns={len(columns)}")
          PY

      - name: Train and gate d1/w1/q1 horizon champions
        run: |
          set -euo pipefail
          bash scripts/retrain_models.sh \
            data/training/modelable_dataset.json \
            data/training \
            "${{ steps.runmeta.outputs.version }}" \
            "d1,w1,q1" \
            "manual" 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Train m3 value/timing champions
        run: |
          set -euo pipefail
          bash scripts/retrain_models.sh \
            data/training/modelable_dataset.json \
            data/training \
            "${{ steps.runmeta.outputs.version }}" \
            "value,timing" \
            "manual" 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Persist horizon competition metrics into app DB
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m models.persist_competition_results \
            --models-dir data/training/models \
            --db data/persistence/app.sqlite 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Sync champion JSON to binary run artifacts
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m models.sync_models_file \
            --models-dir data/training/models \
            --models-file-dir data/training/models_file \
            --tasks d1,w1,q1,value,timing 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Validate generated champions
        run: |
          set -euo pipefail
          for task in d1 w1 q1 value timing; do
            test -s "data/training/models/${task}_champion.json"
            test -s "data/training/models_file/${task}_champion.pkl"
            test -s "data/training/models_file/${task}_champion.manifest.json"
          done
          PYTHONPATH=src python -m floor.db_health --db data/persistence/app.sqlite

      - name: Build compact training summary
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          version = "${{ steps.runmeta.outputs.version }}"
          models_dir = Path("data/training/models")
          metrics_path = Path(f"data/training/metrics/training_metrics_{version}.json")
          out_path = Path("${{ steps.runmeta.outputs.csv_file }}")
          rows = []
          for horizon in ("d1", "w1", "q1"):
              payload = json.loads(
                  (models_dir / f"{horizon}_champion.json").read_text(
                      encoding="utf-8"
                  )
              )
              metrics = payload.get("metrics", {})
              rows.append({
                  "horizon": horizon,
                  "model_name": payload.get("model_name"),
                  "version": payload.get("version"),
                  "metric_1": metrics.get("mae_floor"),
                  "metric_2": metrics.get("mae_ceiling"),
                  "metric_3": metrics.get("mae_spread"),
              })
          m3 = json.loads(metrics_path.read_text(encoding="utf-8"))
          rows.append({
              "horizon": "m3",
              "model_name": "m3_value_linear + m3_timing_multiclass",
              "version": version,
              "metric_1": m3.get("value", {}).get("mae_realized_floor"),
              "metric_2": m3.get("timing", {}).get("top1_accuracy"),
              "metric_3": m3.get("timing", {}).get("expected_week_distance"),
          })
          out_path.parent.mkdir(parents=True, exist_ok=True)
          with out_path.open("w", encoding="utf-8", newline="") as fh:
              writer = csv.DictWriter(
                  fh,
                  fieldnames=[
                      "horizon", "model_name", "version", "metric_1",
                      "metric_2", "metric_3",
                  ],
              )
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Commit lightweight champions only
        if: inputs.commit_champions == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/training/models/d1_champion.json \
            data/training/models/w1_champion.json \
            data/training/models/q1_champion.json \
            data/training/models/value_champion.json \
            data/training/models/timing_champion.json \
            data/training/models/d1_competition.json \
            data/training/models/w1_competition.json \
            data/training/models/q1_competition.json \
            "${{ steps.runmeta.outputs.csv_file }}"
          if git diff --cached --quiet; then
            echo "No lightweight champion changes to commit."
            exit 0
          fi
          git commit -m "chore: publish trained champion metadata"
          git push

      - name: Upload full training run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-train-all-models-${{ steps.runmeta.outputs.version }}
          path: |
            data/training
            data/market/market_data.sqlite
            data/persistence/app.sqlite
          if-no-files-found: error
          retention-days: 14

      - name: Publish workflow summary
        run: |
          {
            echo "## manual_train_all_models"
            echo "- Version: \`${{ steps.runmeta.outputs.version }}\`"
            echo "- Full DB/dataset/PKL/log outputs: Actions artifact only (14 days)"
            echo "- Classic promotion: same-current-validation champion gate"
            echo "- Git commit enabled: \`${{ inputs.commit_champions }}\` (lightweight JSON/CSV only)"
          } >> "$GITHUB_STEP_SUMMARY"
