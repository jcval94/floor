name: manual_retrain_backtest_report

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version (UTC timestamp when empty)"
        required: false
        default: ""
      yahoo_range:
        description: "Yahoo history used to rebuild the ABT"
        required: false
        default: "3y"
      window_sessions:
        description: "Backtest window in trading sessions"
        required: false
        default: "21"
      min_rows_per_symbol:
        description: "Minimum daily rows required per symbol before training"
        required: false
        default: "300"
      final_fit:
        description: "Train final full-dataset candidates after unbiased backtest"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: manual-retrain-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrain_backtest_report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v4, pinned to the exact commit already used by CI.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-python v5, pinned to the exact commit already used by CI.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Resolve run metadata
        id: runmeta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION_TAG="$VERSION_INPUT"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          RUN_ROOT="data/retrain_backtest/${VERSION_TAG}"
          LOG_FILE="${RUN_ROOT}/workflow.log"
          mkdir -p "$RUN_ROOT"
          touch "$LOG_FILE"
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "run_root=$RUN_ROOT" >> "$GITHUB_OUTPUT"
          echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"

      - name: Initialize ephemeral DBs
        run: |
          set -euo pipefail
          make init-dbs 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Refresh market history from Yahoo
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range "${{ inputs.yahoo_range }}" \
            --interval "1d" \
            --sleep-seconds 0.4 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Validate market coverage and freshness
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol "${{ inputs.min_rows_per_symbol }}" \
            --max-age-days 7 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Rebuild raw training rows
        run: |
          set -euo pipefail
          mkdir -p data/training
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --output data/training/yahoo_market_rows.jsonl \
            2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Build leakage-safe modelable dataset
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m features.run_features \
            --input data/training/yahoo_market_rows.jsonl \
            --output data/training/modelable_dataset.json \
            2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Preflight monthly holdout maturity
        env:
          WINDOW_SESSIONS: ${{ inputs.window_sessions }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY' 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"
          import json
          import os
          from pathlib import Path
          from reporting.retrain_backtest_report import select_backtest_windows

          payload = json.loads(Path("data/training/modelable_dataset.json").read_text(encoding="utf-8"))
          rows = payload.get("rows", [])
          window = int(os.environ["WINDOW_SESSIONS"])
          windows = select_backtest_windows(rows, window_sessions=window)
          print(
              "monthly holdout OK",
              "latest=", windows["latest"][0], "->", windows["latest"][-1],
              "common_matured=", windows["common_matured"][0], "->", windows["common_matured"][-1],
          )
          PY

      - name: Retrain evaluation suite, backtest, and fit final candidates
        env:
          FINAL_FIT: ${{ inputs.final_fit }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$FINAL_FIT" != "true" ]; then
            EXTRA_ARGS+=(--skip-final-fit)
          fi
          PYTHONPATH=src python -m reporting.retrain_backtest_report \
            --dataset data/training/modelable_dataset.json \
            --output-root "${{ steps.runmeta.outputs.run_root }}" \
            --version "${{ steps.runmeta.outputs.version }}" \
            --window-sessions "${{ inputs.window_sessions }}" \
            "${EXTRA_ARGS[@]}" 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"

      - name: Validate report integrity
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY' 2>&1 | tee -a "${{ steps.runmeta.outputs.log_file }}"
          import json
          from pathlib import Path

          root = Path("${{ steps.runmeta.outputs.run_root }}")
          report_path = root / "report" / "backtest_report.json"
          summary_path = root / "run_summary.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))

          methodology = report.get("methodology", {})
          if methodology.get("test_holdout_used_for_training") is not False:
              raise SystemExit("FAIL: report indicates test holdout was used for training")
          if methodology.get("live_or_paper_execution_enabled") is not False:
              raise SystemExit("FAIL: workflow must never activate PAPER/LIVE")

          common = report["windows"]["common_matured"]
          for model in ("d1", "w1", "q1", "m3", "weekly_opportunity"):
              metrics = common["models"][model]
              if metrics.get("status") != "ok" or int(metrics.get("rows", 0)) <= 0:
                  raise SystemExit(f"FAIL: common matured backtest invalid for {model}: {metrics}")

          latest = report["windows"]["latest"]
          if latest["models"]["d1"].get("status") != "ok":
              raise SystemExit("FAIL: d1 must be scoreable in the latest window")

          portfolio = latest.get("portfolio_backtest", {})
          if portfolio.get("status") != "ok":
              raise SystemExit(f"FAIL: latest portfolio simulation invalid: {portfolio}")
          if portfolio.get("signal_to_trade_lag") != "1 session":
              raise SystemExit("FAIL: portfolio backtest must trade one session after scoring")
          if portfolio.get("transaction_costs_included") is not True:
              raise SystemExit("FAIL: transaction costs must be included")

          if summary.get("final_fit", {}).get("promotion_applied") is True:
              raise SystemExit("FAIL: this workflow is evaluation-only and cannot auto-promote")
          print("report integrity OK")
          PY

      - name: Publish report to workflow summary
        run: |
          set -euo pipefail
          {
            echo "## Retrain + monthly backtest"
            echo "- Version: \`${{ steps.runmeta.outputs.version }}\`"
            echo "- Evaluation fit: purged before common matured holdout"
            echo "- Final fit requested: \`${{ inputs.final_fit }}\`"
            echo "- Automatic promotion: \`false\`"
            echo ""
            cat "${{ steps.runmeta.outputs.run_root }}/report/backtest_report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v4.6.2 pinned by commit SHA.
      - name: Upload retraining and backtest artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrain-backtest-${{ steps.runmeta.outputs.version }}
          path: |
            ${{ steps.runmeta.outputs.run_root }}
            data/training/modelable_dataset.json
          if-no-files-found: error
          retention-days: 14
