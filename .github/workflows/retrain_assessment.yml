name: retrain_assessment

on:
  schedule:
    - cron: "0 12 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain-assessment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assess_critical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Initialize DBs
        run: make init-dbs

      - name: Refresh market data before assessment
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range 2y \
            --interval 1d \
            --sleep-seconds 0.4

      - name: Validate assessment source data
        run: |
          set -euo pipefail
          rows=$(sqlite3 data/market/market_data.sqlite "SELECT COUNT(*) FROM daily_bars;")
          if [ "${rows:-0}" -le 0 ]; then
            echo "::error::Retrain assessment refused: daily_bars is empty."
            exit 1
          fi
          echo "assessment_source_rows=$rows"

      - name: Build current modelable dataset from populated DB
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --output data/training/yahoo_market_rows.jsonl
          test -s data/training/yahoo_market_rows.jsonl || {
            echo "::error::Retrain assessment refused: raw training rows are empty."
            exit 1
          }
          PYTHONPATH=src python -m features.run_features \
            --input data/training/yahoo_market_rows.jsonl \
            --output data/training/modelable_dataset.json

      - name: Validate modelable dataset has rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/training/modelable_dataset.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          rows = payload.get('rows', []) if isinstance(payload, dict) else payload
          if not isinstance(rows, list) or not rows:
              raise SystemExit('Retrain assessment refused: modelable dataset has zero rows')
          print(f'modelable_rows={len(rows)}')
          PY

      - name: Run retrain assessment
        run: PYTHONPATH=src python -m floor.main review-training

      - name: Commit assessment history only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/training/reviews.jsonl \
            data/training/review_summary_latest.json
          if git diff --cached --quiet; then
            echo "No retrain assessment state changes to commit."
            exit 0
          fi

          git commit -m "chore: retrain assessment"
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push retrain assessment after 3 attempts."
              exit 1
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

      - name: Upload reconstructable assessment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrain-assessment-artifacts
          path: |
            data/training/reviews.jsonl
            data/training/review_summary_latest.json
            data/training/modelable_dataset.json
            data/training/yahoo_market_rows.jsonl
            data/market/market_data.sqlite
            data/persistence/app.sqlite
          if-no-files-found: error

  assess_info:
    needs: assess_critical
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: echo "retrain_assessment result=${{ needs.assess_critical.result }}"
