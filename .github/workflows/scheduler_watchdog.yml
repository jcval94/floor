name: scheduler_watchdog

on:
  schedule:
    # Independent quarter-hour wake mesh, offset from intraday_engine.
    # Actual dispatch is gated by the NYSE session in America/New_York.
    - cron: "2,17,32,47 13-23 * * 1-5"
  workflow_run:
    # GitHub-native recovery mesh: any surviving operational workflow can wake
    # the watchdog. This does not eliminate a platform-wide Actions outage, but
    # it removes monitoring as the single internal wake-up dependency.
    workflows: ["strategy_live", "intraday_engine", "monitoring", "eod"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheduler_watchdog.yml"
      - ".github/workflows/intraday_engine.yml"
      - ".github/workflows/strategy_live.yml"
      - ".github/workflows/eod.yml"
      - ".github/workflows/monitoring.yml"
      # A new Strategy League epoch can bootstrap its frozen Weekly artifact
      # successfully while still waiting for the first valid EOD genesis.
      # Wake the watchdog on league/genesis contract changes so it can request
      # a guarded EOD immediately when the market-close window is already due.
      - "config/strategy_league.json"
      - "config/strategy_league_genesis_request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: floor-scheduler-watchdog
  cancel-in-progress: true

jobs:
  dispatch_backstops:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout market calendar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve NYSE recovery windows
        id: market
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from datetime import datetime, timedelta

          from utils.market_session import ET, get_session_info

          now = datetime.now(ET)
          info = get_session_info(now)
          market_live = False
          intraday_window = False
          eod_window = False
          monitoring_window = False
          if info.is_open_day and info.market_open and info.market_close:
              market_live = info.market_open <= now < info.market_close
              intraday_window = info.market_open <= now <= info.market_close + timedelta(minutes=20)
              eod_window = info.market_close + timedelta(minutes=20) <= now <= info.market_close + timedelta(hours=6)
              monitoring_window = info.market_open <= now <= info.market_close + timedelta(hours=1)

          values = {
              "now_et": now.isoformat(),
              "market_live": str(market_live).lower(),
              "intraday_window": str(intraday_window).lower(),
              "eod_window": str(eod_window).lower(),
              "monitoring_window": str(monitoring_window).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\n")
          print(values)
          PY

      - name: Dispatch only missing workflow polls
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_LIVE: ${{ steps.market.outputs.market_live }}
          INTRADAY_WINDOW: ${{ steps.market.outputs.intraday_window }}
          EOD_WINDOW: ${{ steps.market.outputs.eod_window }}
          MONITORING_WINDOW: ${{ steps.market.outputs.monitoring_window }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          now_epoch="$(date -u +%s)"

          list_runs_with_retry() {
            local workflow="$1"
            local attempt runs
            for attempt in 1 2 3; do
              if runs="$(gh run list \
                --repo "$repo" \
                --workflow "$workflow" \
                --branch main \
                --limit 20 \
                --json createdAt,status,conclusion,event,databaseId,headSha 2>/dev/null)"; then
                printf '%s' "$runs"
                return 0
              fi
              sleep $((attempt * 2))
            done
            echo "::error::Unable to inspect recent runs for $workflow after 3 attempts." >&2
            return 2
          }

          has_recent_or_active_run() {
            local workflow="$1"
            local max_age_seconds="$2"
            local runs cutoff active_cutoff
            cutoff=$((now_epoch - max_age_seconds))
            # Active jobs get one extra 30-minute grace window so legitimate
            # long-running EOD/intraday jobs are not duplicated. After that,
            # a stuck queued/in-progress run must not suppress recovery forever.
            active_cutoff=$((cutoff - 1800))
            if ! runs="$(list_runs_with_retry "$workflow")"; then
              return 2
            fi

            jq -e --argjson cutoff "$cutoff" --argjson active_cutoff "$active_cutoff" '
              any(.[];
                (
                  .status != "completed"
                  and ((.createdAt | fromdateiso8601) >= $active_cutoff)
                )
                or (
                  .conclusion == "success"
                  and ((.createdAt | fromdateiso8601) >= $cutoff)
                )
              )
            ' <<<"$runs" >/dev/null
          }

          deterministic_failure_circuit_open() {
            local workflow="$1"
            local signatures="$2"
            local runs run_id logs attempt pattern
            local -a deterministic_patterns

            # A frozen-contract mismatch cannot self-heal by retrying the same
            # commit. Scope the breaker to HEAD so the next corrective commit
            # immediately restores normal recovery.
            if ! runs="$(list_runs_with_retry "$workflow")"; then
              return 2
            fi
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '
              [
                .[]
                | select(
                    .status == "completed"
                    and .conclusion == "failure"
                    and .headSha == $sha
                  )
              ]
              | sort_by(.createdAt)
              | reverse
              | .[0].databaseId // empty
            ' <<<"$runs")"
            if [ -z "$run_id" ]; then
              return 1
            fi

            logs=""
            for attempt in 1 2 3; do
              if logs="$(gh run view "$run_id" --repo "$repo" --log-failed 2>/dev/null)"; then
                break
              fi
              sleep $((attempt * 2))
            done
            if [ -z "$logs" ]; then
              echo "::warning::Unable to classify deterministic failure; recovery remains enabled." >&2
              return 2
            fi
            IFS='|' read -r -a deterministic_patterns <<<"$signatures"
            for pattern in "${deterministic_patterns[@]}"; do
              if [ -n "$pattern" ] && grep -Fq "$pattern" <<<"$logs"; then
                echo "::warning::$workflow deterministic failure remains open on current SHA=$GITHUB_SHA run=$run_id signature=$pattern; suppressing recovery dispatch until a corrective commit lands."
                return 0
              fi
            done
            return 1
          }

          dispatch_with_retry() {
            local workflow="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --repo "$repo" --ref main; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error::Unable to dispatch $workflow after 3 attempts." >&2
            return 1
          }

          dispatch_if_stale() {
            local workflow="$1"
            local max_age_seconds="$2"
            local output_name="$3"
            local deterministic_signature="${4:-}"
            local rc circuit_rc
            if has_recent_or_active_run "$workflow" "$max_age_seconds"; then
              echo "$output_name=skipped_recent_or_active" >> "$GITHUB_OUTPUT"
              echo "$workflow: recent/active run exists; no duplicate dispatch."
              return 0
            else
              rc=$?
            fi

            if [ "$rc" -eq 2 ]; then
              echo "$output_name=inspection_failed" >> "$GITHUB_OUTPUT"
              return 1
            fi

            if [ -n "$deterministic_signature" ]; then
              if deterministic_failure_circuit_open "$workflow" "$deterministic_signature"; then
                echo "$output_name=blocked_deterministic_same_sha" >> "$GITHUB_OUTPUT"
                return 0
              else
                circuit_rc=$?
              fi
              if [ "$circuit_rc" -eq 2 ]; then
                echo "::warning::$workflow deterministic classification unavailable; failing open to normal recovery."
              fi
            fi

            if dispatch_with_retry "$workflow"; then
              echo "$output_name=dispatched" >> "$GITHUB_OUTPUT"
              echo "$workflow: watchdog dispatched missing poll."
              return 0
            fi

            echo "$output_name=dispatch_failed" >> "$GITHUB_OUTPUT"
            return 1
          }

          # Recovery is calendar-aware in America/New_York. Heartbeat and
          # strategy_live recovery are never launched after their allowed market
          # window, even when this watchdog is awakened by a late workflow_run.
          failures=0
          if [ "$INTRADAY_WINDOW" = "true" ]; then
            dispatch_if_stale intraday_engine.yml 1200 intraday || failures=$((failures + 1))
          else
            echo "intraday=outside_market_window" >> "$GITHUB_OUTPUT"
          fi

          if [ "$MARKET_LIVE" = "true" ]; then
            dispatch_if_stale strategy_live.yml 2100 strategy_live || failures=$((failures + 1))
          else
            echo "strategy_live=outside_market_window" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EOD_WINDOW" = "true" ]; then
            dispatch_if_stale eod.yml 2100 eod "Strategy League frozen contract changed; create a new league_id instead of rewriting history|Material shadow/EOD divergence:" || failures=$((failures + 1))
          else
            echo "eod=outside_close_window" >> "$GITHUB_OUTPUT"
          fi

          if [ "$MONITORING_WINDOW" = "true" ]; then
            dispatch_if_stale monitoring.yml 3900 monitoring || failures=$((failures + 1))
          else
            echo "monitoring=outside_monitoring_window" >> "$GITHUB_OUTPUT"
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error::Scheduler watchdog finished with $failures recovery failure(s)."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Floor scheduler watchdog"
            echo "- trigger: ${{ github.event_name }}"
            echo "- schedule: ${{ github.event.schedule || 'n/a' }}"
            echo "- upstream workflow: ${{ github.event.workflow_run.name || 'n/a' }}"
            echo "- upstream conclusion: ${{ github.event.workflow_run.conclusion || 'n/a' }}"
            echo "- now ET: ${{ steps.market.outputs.now_et }}"
            echo "- market live: ${{ steps.market.outputs.market_live }}"
            echo "- intraday window: ${{ steps.market.outputs.intraday_window }}"
            echo "- EOD window: ${{ steps.market.outputs.eod_window }}"
            echo "- intraday: ${{ steps.dispatch.outputs.intraday }}"
            echo "- strategy live: ${{ steps.dispatch.outputs.strategy_live }}"
            echo "- eod: ${{ steps.dispatch.outputs.eod }}"
            echo "- monitoring: ${{ steps.dispatch.outputs.monitoring }}"
            echo "- policy: dispatch only inside NYSE-aware windows and only when no recent/active run exists; deterministic EOD failures are circuit-broken for the same commit SHA"
            echo "- unconditional main-push execution: disabled for intraday/eod"
          } >> "$GITHUB_STEP_SUMMARY"
