name: monitoring

on:
  schedule:
    # Off-peak minute reduces GitHub Actions schedule delay risk.
    - cron: "11 14-23 * * 1-5"
  workflow_run:
    workflows: ["intraday_engine", "eod"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Determine monitoring eligibility before writer lock
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run=false
          reason=unsupported_context

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$UPSTREAM_CONCLUSION" = "success" ] && [ "$UPSTREAM_BRANCH" = "main" ]; then
              artifacts=""
              for attempt in 1 2 3; do
                if artifacts=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/artifacts?per_page=100"); then
                  break
                fi
                artifacts=""
                sleep $((attempt * 2))
              done

              if [ -z "$artifacts" ]; then
                reason="upstream_artifact_lookup_failed"
              else
                count=0
                case "$UPSTREAM_NAME" in
                  intraday_engine)
                    prefix="intraday-audit-${UPSTREAM_RUN_ID}-"
                    count=$(jq --arg prefix "$prefix" \
                      '[.artifacts[] | select((.name | startswith($prefix)) and .expired == false)] | length' \
                      <<<"$artifacts")
                    ;;
                  eod)
                    expected="eod-audit-${UPSTREAM_RUN_ID}"
                    count=$(jq --arg expected "$expected" \
                      '[.artifacts[] | select(.name == $expected and .expired == false)] | length' \
                      <<<"$artifacts")
                    ;;
                  *)
                    reason="unsupported_upstream_${UPSTREAM_NAME}"
                    ;;
                esac

                if [ "${count:-0}" -gt 0 ]; then
                  run=true
                  reason="${UPSTREAM_NAME}_runtime_evidence_present"
                elif [ "$reason" = "unsupported_context" ]; then
                  reason="${UPSTREAM_NAME}_completed_without_runtime_evidence"
                fi
              fi
            else
              reason="upstream_${UPSTREAM_CONCLUSION:-unknown}_branch_${UPSTREAM_BRANCH:-unknown}"
            fi
          elif [ "$REF_NAME" = "main" ]; then
            run=true
            reason="${EVENT_NAME}_main"
          else
            reason="${EVENT_NAME}_non_main"
          fi

          {
            echo "run=$run"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "monitoring eligibility run=$run reason=$reason"

  monitor_critical:
    needs: eligibility
    if: needs.eligibility.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: floor-monitoring-state-writer
      # Never let a newer eligible run kill a valid snapshot already in flight.
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -e . "numpy>=2.0,<3"

      - name: Detect market session
        id: session
        run: PYTHONPATH=src python -m utils.workflow_guards check --kind always_open_day --tolerance-minutes 0 --data-dir data

      - name: Skip closed market day
        if: steps.session.outputs.run != 'true'
        run: echo "Monitoring skipped because today is not a US market session."

      - name: Restore rolling runtime state
        if: steps.session.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore

      # health_snapshot reads restored report/prediction/review/marker files.
      # SQLite hydration is intentionally unnecessary here.
      - name: Generate operational health snapshot
        if: steps.session.outputs.run == 'true'
        id: health
        run: |
          set +e
          rm -f data/metrics/public_metrics.json
          PYTHONPATH=src python -m monitoring.health_snapshot \
            --data-dir data \
            --universe config/universe.yaml \
            --output data/metrics/public_metrics.json
          rc=$?
          valid=false
          if [ -s data/metrics/public_metrics.json ] && python -m json.tool data/metrics/public_metrics.json >/dev/null 2>&1; then
            valid=true
          fi
          {
            echo "rc=$rc"
            echo "snapshot_valid=$valid"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish isolated monitoring state
        if: steps.session.outputs.run == 'true' && steps.health.outputs.snapshot_valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/monitoring_state.sh publish

      - name: Upload immutable monitoring snapshot
        if: steps.session.outputs.run == 'true' && steps.health.outputs.snapshot_valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monitoring-health-${{ github.run_id }}
          path: data/metrics/public_metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow on invalid or critical health
        if: steps.session.outputs.run == 'true' && (steps.health.outputs.rc != '0' || steps.health.outputs.snapshot_valid != 'true')
        run: |
          echo "::error::Operational health snapshot is invalid or CRITICAL."
          if [ -f data/metrics/public_metrics.json ]; then
            cat data/metrics/public_metrics.json
          fi
          exit 1

  monitor_info:
    needs: [eligibility, monitor_critical]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          echo "monitoring eligibility=${{ needs.eligibility.outputs.run }}"
          echo "eligibility_reason=${{ needs.eligibility.outputs.reason }}"
          echo "monitoring result=${{ needs.monitor_critical.result }}"
          echo "eligibility=pre-writer-lock"
          echo "writer_cancel_in_progress=false"
          echo "polling=hourly-market-window"
          echo "sqlite_hydration=disabled"
          echo "authoritative_runtime_writes=disabled"
          echo "monitoring_state=github_release:monitoring-state-v1"
          echo "git_operational_writes=disabled"
