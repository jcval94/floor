name: monitoring

on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor_critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate operational health snapshot
        id: health
        run: |
          set +e
          PYTHONPATH=src python -m monitoring.health_snapshot \
            --data-dir data \
            --universe config/universe.yaml \
            --output data/metrics/public_metrics.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit monitoring state only when semantics change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics/public_metrics.json
          if git diff --cached --quiet; then
            echo "Monitoring semantic state unchanged; no commit required."
            exit 0
          fi

          git commit -m "chore: monitoring health state"
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push monitoring state after 3 attempts."
              exit 1
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

      - name: Upload monitoring snapshot
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-health
          path: data/metrics/public_metrics.json
          if-no-files-found: error

      - name: Fail workflow on critical health
        if: steps.health.outputs.rc != '0'
        run: |
          echo "::error::Operational health snapshot is CRITICAL."
          cat data/metrics/public_metrics.json
          exit 1

  monitor_info:
    needs: monitor_critical
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summary
        run: echo "monitoring result=${{ needs.monitor_critical.result }}"
