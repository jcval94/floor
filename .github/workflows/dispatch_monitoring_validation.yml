name: dispatch-monitoring-validation

on:
  push:
    branches: [fix/p1-authoritative-state-writers]
    paths:
      - ".github/workflows/dispatch_monitoring_validation.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch monitoring on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run monitoring.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "monitoring_dispatch=main"
