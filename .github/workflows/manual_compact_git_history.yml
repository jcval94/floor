name: manual_compact_git_history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PURGE_GENERATED_DATA_HISTORY exactly"
        required: true
        default: ""

permissions:
  contents: write
  pull-requests: read

# Share the runtime-state writer lock so no automated writer can mutate the
# authoritative release while the destructive rewrite is being prepared.
concurrency:
  group: floor-runtime-state-writer
  cancel-in-progress: false

jobs:
  compact:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Safety preflight
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "PURGE_GENERATED_DATA_HISTORY" ] || {
            echo "::error::Confirmation phrase does not match."
            exit 1
          }

          # A multi-GB mirror rewrite can hold the shared runtime-state writer
          # lock for a long time. Never start it before/during a trading session.
          PYTHONPATH=src python - <<'PY'
          from datetime import datetime, timedelta
          from utils.market_session import ET, get_session_info

          now = datetime.now(tz=ET)
          info = get_session_info(now)
          if info.is_open_day:
              assert info.market_close is not None
              safe_after = info.market_close + timedelta(hours=1)
              if now < safe_after:
                  raise SystemExit(
                      f"History compaction is allowed only >=1h after market close on an open day; now={now.isoformat()} safe_after={safe_after.isoformat()}"
                  )
          print(f"compaction_window_ok now_et={now.isoformat()} open_day={info.is_open_day}")
          PY

          protected_branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | select(.protected == true) | .name')
          [ -z "$protected_branches" ] || {
            echo "::error::History compaction requires force-push access to every branch. Protected branches:"
            printf '%s\n' "$protected_branches"
            exit 1
          }

          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq 'length')
          [ "$open_prs" = "0" ] || {
            echo "::error::History compaction requires zero open PRs; found $open_prs. Merge/close them first."
            exit 1
          }
          echo "Safety preflight OK. This run WILL rewrite every advertised branch/tag commit SHA."

      - name: Install pinned history rewrite tool
        run: python -m pip install git-filter-repo==2.47.0

      - name: Preserve latest operational state outside Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never overwrite a fresher rolling release with stale data still
          # present in the pre-compaction checkout. Restore first, then republish.
          bash scripts/runtime_state.sh restore
          bash scripts/runtime_state.sh publish

      - name: Save lightweight model registry and pre-rewrite audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIGHT="$RUNNER_TEMP/lightweight"
          mkdir -p "$LIGHT/data/training/models" "$RUNNER_TEMP/history-audit"
          cp -a data/training/models/*.json "$LIGHT/data/training/models/"
          : > "$LIGHT/data/.gitkeep"
          (
            cd "$LIGHT"
            sha256sum data/training/models/*.json | sort > "$RUNNER_TEMP/history-audit/model_registry_before.sha256"
          )
          for champion in d1 w1 q1 value timing; do
            test -s "data/training/models/${champion}_champion.json" || {
              echo "::error::Missing champion before rewrite: ${champion}_champion.json"
              exit 1
            }
          done
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/history-audit/repo_before.json"
          git ls-remote --heads --tags origin | sort > "$RUNNER_TEMP/history-audit/refs_before.txt"
          printf '%s\n' \
            'Generated data under data/ is intentionally removed from Git history.' \
            'The latest operational state is preserved in release runtime-state-v1.' \
            'Per-run historical outputs remain available through their Actions retention window.' \
            > "$RUNNER_TEMP/history-audit/README.txt"

      - name: Mirror repository and remove generated data from every advertised ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/floor-mirror.git"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --mirror --progress "$AUTH_URL" "$MIRROR"
          du -sk "$MIRROR" | tee "$RUNNER_TEMP/history-audit/mirror_before_kb.txt"

          git -C "$MIRROR" filter-repo \
            --force \
            --path data \
            --invert-paths

          # git-filter-repo intentionally removes remotes after a destructive rewrite.
          git -C "$MIRROR" remote add origin "$AUTH_URL"
          du -sk "$MIRROR" | tee "$RUNNER_TEMP/history-audit/mirror_after_filter_kb.txt"

      - name: Restore only current lightweight champion JSON on rewritten main
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/floor-mirror.git"
          WORK="$RUNNER_TEMP/rewritten-main"
          LIGHT="$RUNNER_TEMP/lightweight"
          git --git-dir="$MIRROR" worktree add "$WORK" main
          mkdir -p "$WORK/data/training/models"
          cp -a "$LIGHT/data/.gitkeep" "$WORK/data/.gitkeep"
          cp -a "$LIGHT/data/training/models/"*.json "$WORK/data/training/models/"
          (
            cd "$WORK"
            sha256sum data/training/models/*.json | sort > "$RUNNER_TEMP/history-audit/model_registry_after_restore.sha256"
          )
          cmp "$RUNNER_TEMP/history-audit/model_registry_before.sha256" "$RUNNER_TEMP/history-audit/model_registry_after_restore.sha256" || {
            echo "::error::Model registry changed during history rewrite."
            exit 1
          }
          git -C "$WORK" config user.name "github-actions[bot]"
          git -C "$WORK" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -f data/.gitkeep data/training/models/*.json
          if ! git -C "$WORK" diff --cached --quiet; then
            git -C "$WORK" commit -m "chore: restore lightweight model registry after history compaction"
          fi
          git --git-dir="$MIRROR" worktree remove "$WORK"

      - name: Verify remote refs did not move during rewrite
        run: |
          set -euo pipefail
          git ls-remote --heads --tags origin | sort > "$RUNNER_TEMP/history-audit/refs_pre_push.txt"
          if ! cmp -s "$RUNNER_TEMP/history-audit/refs_before.txt" "$RUNNER_TEMP/history-audit/refs_pre_push.txt"; then
            echo "::error::Remote branch/tag refs changed while compaction was being prepared. Aborting before any force-push."
            diff -u "$RUNNER_TEMP/history-audit/refs_before.txt" "$RUNNER_TEMP/history-audit/refs_pre_push.txt" || true
            exit 1
          fi

      - name: Atomically rewrite only refs covered by exact leases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/floor-mirror.git"
          REF_SNAPSHOT="$RUNNER_TEMP/history-audit/refs_before.txt"

          # Build one exact lease and one explicit refspec per ref observed at
          # preflight. A ref created after the snapshot is never touched; a ref
          # moved after the snapshot makes the entire atomic push fail.
          leases=()
          refspecs=()
          while read -r expected_sha ref; do
            [ -n "$expected_sha" ] && [ -n "$ref" ] || continue
            case "$ref" in
              *'^{}') continue ;;
              refs/heads/*|refs/tags/*) ;;
              *) continue ;;
            esac

            leases+=("--force-with-lease=${ref}:${expected_sha}")
            if git --git-dir="$MIRROR" show-ref --verify --quiet "$ref"; then
              refspecs+=("${ref}:${ref}")
            else
              # The filter removed this ref completely; delete only if its
              # remote SHA still matches the preflight snapshot.
              refspecs+=(":${ref}")
            fi
          done < "$REF_SNAPSHOT"

          [ "${#refspecs[@]}" -gt 0 ] || {
            echo "::error::No branch/tag refspecs were resolved for history compaction."
            exit 1
          }

          git -C "$MIRROR" push --dry-run --atomic \
            "${leases[@]}" origin "${refspecs[@]}"
          git -C "$MIRROR" push --atomic \
            "${leases[@]}" origin "${refspecs[@]}"

          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/history-audit/repo_after_push.json"
          git -C "$MIRROR" show-ref > "$RUNNER_TEMP/history-audit/refs_after.txt"

      - name: Verify rewritten main and model hashes from remote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/verify-main"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth=1 --branch main "$AUTH_URL" "$VERIFY"
          (
            cd "$VERIFY"
            sha256sum data/training/models/*.json | sort > "$RUNNER_TEMP/history-audit/model_registry_remote.sha256"
          )
          cmp "$RUNNER_TEMP/history-audit/model_registry_before.sha256" "$RUNNER_TEMP/history-audit/model_registry_remote.sha256" || {
            echo "::error::Remote model registry differs after rewrite."
            exit 1
          }
          test ! -d "$VERIFY/data/predictions"
          test ! -d "$VERIFY/data/signals"
          du -sk "$VERIFY" | tee "$RUNNER_TEMP/history-audit/shallow_clone_after_kb.txt"

      - name: Report compaction result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'history-audit'
          before = json.loads((root / 'repo_before.json').read_text())
          after = json.loads((root / 'repo_after_push.json').read_text())
          before_kb = int((root / 'mirror_before_kb.txt').read_text().split()[0])
          after_kb = int((root / 'mirror_after_filter_kb.txt').read_text().split()[0])
          reduction = 1.0 - (after_kb / before_kb) if before_kb else 0.0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Destructive Git history compaction\n')
              out.write(f'- GitHub reported size before: `{before.get("size")} KB`\n')
              out.write(f'- Local mirror before filter: `{before_kb} KB`\n')
              out.write(f'- Local mirror after filter: `{after_kb} KB`\n')
              out.write(f'- Local object reduction: `{reduction:.1%}`\n')
              out.write(f'- GitHub reported size immediately after push: `{after.get("size")} KB`\n')
              out.write('- Runtime state preserved in release: `runtime-state-v1`\n')
              out.write('- All old clones must be re-cloned because branch/tag SHAs changed.\n')
              if int(after.get('size') or 0) > 500_000:
                  out.write('- Warning: GitHub may still retain unreachable/PR-ref objects until server GC. If the reported size remains high after GC, migrate current main to a fresh repository and archive this repository.\n')
          PY

      - name: Upload rewrite audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-compaction-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/history-audit
          if-no-files-found: error
          retention-days: 90
