name: retrospective_replay

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First replay session (YYYY-MM-DD)"
        required: true
        default: "2026-08-24"
      end:
        description: "Last replay session (YYYY-MM-DD)"
        required: true
        default: "2026-09-04"
  push:
    branches:
      - feat/point-in-time-replay
    paths:
      - replay_request.json

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Restore frozen runtime artifacts locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore

      - name: Preflight serving-compatible schema-v2 champions
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m utils.model_artifact_guard \
            --registry data/training/models
          artifact=data/metrics/strategy_league/models/weekly_opportunity_challenger.json
          test -s "$artifact" || { echo "::error::Missing replay artifact: $artifact"; exit 1; }
          if head -c 120 "$artifact" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "::error::Replay artifact is an unresolved LFS pointer: $artifact"
            exit 1
          fi

      - name: Resolve replay window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ github.event.inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ github.event.inputs.end }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          payload = json.load(open("replay_request.json", encoding="utf-8"))
          print(f"start={payload['start']}")
          print(f"end={payload['end']}")
          PY
          fi

      - name: Run isolated point-in-time replay
        run: |
          set -euo pipefail
          out="data/replay/${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          PYTHONPATH=src python -m replay.runner \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --output "$out"

      - name: Stamp counterfactual diagnostic evidence contract
        run: |
          set -euo pipefail
          out="data/replay/${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          python - "$out" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          description = (
              "Counterfactual diagnostic replay of the fully repaired Floor system using "
              "serving-compatible schema-v2 champions trained strictly before the replay window."
          )
          manifest_path = root / "replay_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["description"] = description
          manifest["prospective_evidence"] = False
          manifest.setdefault("isolation", {})["strategy_league_v3_writes"] = False
          manifest["historical_strategy_league_epochs_preserved"] = [
              "strategy_league_v1",
              "strategy_league_v2",
          ]
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          report_path = root / "REPLAY_REPORT.md"
          report = report_path.read_text(encoding="utf-8")
          old = (
              "> Diagnostic retrospective evidence only. This replay is isolated from "
              "Strategy League v2 and is not prospective evidence."
          )
          new = (
              f"> {description}\n> Retrospective diagnostic evidence only; it is not "
              "prospective evidence and does not claim to reproduce the exact models that "
              "would have run absent the historical serving bug."
          )
          report = report.replace(old, new)
          report = report.replace(
              "- This replay never writes to runtime-state, Pages, production predictions, or Strategy League v2.",
              "- This replay never writes to runtime-state, Pages, production predictions, or prospective Strategy League v3; v1/v2 remain historical.",
          )
          report_path.write_text(report, encoding="utf-8")
          PY

      - name: Audit replay isolation and temporal contract
        run: |
          set -euo pipefail
          out="data/replay/${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}"
          python - "$out" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "replay_manifest.json").read_text(encoding="utf-8"))
          assert manifest["prospective_evidence"] is False
          assert manifest["blocked_count"] == 0
          assert all(value is False for value in manifest["isolation"].values())
          assert manifest["description"].startswith("Counterfactual diagnostic replay")
          audits = [
              json.loads(line)
              for line in (root / "point_in_time_audit.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert audits
          assert all(row["future_data_used"] is False for row in audits)
          print(json.dumps({
              "sessions": len(manifest["market_sessions"]),
              "prediction_count": manifest["prediction_count"],
              "audits": len(audits),
              "isolation": manifest["isolation"],
              "description": manifest["description"],
          }, indent=2))
          PY

      - name: Upload immutable replay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floor-replay-${{ steps.window.outputs.start }}-${{ steps.window.outputs.end }}-${{ github.run_id }}
          path: data/replay/${{ steps.window.outputs.start }}_${{ steps.window.outputs.end }}
          if-no-files-found: error
          retention-days: 90
