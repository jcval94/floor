name: force-cancel-stale-compaction

on:
  push:
    branches: [fix/p1-authoritative-state-writers]
    paths:
      - ".github/workflows/force_cancel_stale_compaction.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel obsolete destructive run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/35937791334/force-cancel"
          echo "force_cancelled_run=35937791334"
