name: intraday_engine

on:
  schedule:
    # Avoid top-of-hour scheduler congestion while retaining four polls/hour.
    # The gate restores only checkpoint markers, not the ~120 MB runtime state.
    - cron: "7,22,37,52 13-22 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force engine_critical even when gate would skip"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_event:
        description: "Event used when force_run=true"
        required: false
        default: "OPEN"
        type: choice
        options: [OPEN, OPEN_PLUS_2H, OPEN_PLUS_4H, OPEN_PLUS_6H, CLOSE]
      repair_existing_checkpoint:
        description: "Re-run the latest already-completed checkpoint to repair runtime state"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: intraday-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
      event: ${{ steps.guard.outputs.event }}
      session_day: ${{ steps.guard.outputs.session_day }}
      checkpoint_at: ${{ steps.guard.outputs.checkpoint_at }}
      lateness_minutes: ${{ steps.guard.outputs.lateness_minutes }}
      required_market_session: ${{ steps.guard.outputs.required_market_session }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore lightweight checkpoint state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checkpoint_state.sh restore
      - name: Detect due market checkpoint
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.repair_existing_checkpoint || 'false' }}" = "true" ] && [ "${{ github.event.inputs.force_run || 'false' }}" != "true" ]; then
            echo "::error::repair_existing_checkpoint requires force_run=true"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_run || 'false' }}" = "true" ]; then
            reason=manual_force
            if [ "${{ github.event.inputs.repair_existing_checkpoint || 'false' }}" = "true" ]; then
              reason=manual_repair
            fi
            PYTHONPATH=src python -m utils.workflow_guards resolve-context \
              --event "${{ github.event.inputs.force_event || 'OPEN' }}" \
              --reason "$reason"
          else
            PYTHONPATH=src python -m utils.workflow_guards check --kind intraday --tolerance-minutes 180 --data-dir data
          fi

  engine_critical:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: floor-runtime-state-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -e . "numpy>=2.0,<3"

      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore

      - name: Revalidate immutable checkpoint context under writer lock
        id: lock_guard
        run: |
          set -euo pipefail
          repair_args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.repair_existing_checkpoint || 'false' }}" = "true" ]; then
            repair_args+=(--allow-existing-repair)
          fi
          PYTHONPATH=src python -m utils.workflow_guards validate-context \
            --kind intraday \
            --event "${{ needs.gate.outputs.event }}" \
            --session-day "${{ needs.gate.outputs.session_day }}" \
            --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
            --data-dir data \
            "${repair_args[@]}"

      - name: Initialize DB schemas and repair cache only if absent
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          needs_hydration=false
          if [ ! -s data/persistence/app.sqlite ]; then
            needs_hydration=true
          fi
          make init-db-schemas
          if [ "$needs_hydration" = "true" ]; then
            echo "Persistence cache missing; rebuilding once from durable JSONL ledgers."
            PYTHONPATH=src python -m floor.persistence_hydration --data-dir data
          else
            echo "Persistence cache restored and healthy; full ledger replay skipped."
          fi

      - name: Normalize DB permissions
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          find data/market data/persistence -type d -exec chmod u+rwx {} +
          find data/market data/persistence -type f -exec chmod u+rw {} +

      - name: Ensure market data is populated and current
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          market_rows=$(sqlite3 data/market/market_data.sqlite "SELECT COUNT(*) FROM daily_bars;" 2>/dev/null || echo 0)
          if [ "${market_rows:-0}" = "0" ]; then
            echo "Market DB is empty; restoring a 2y serving history."
            PYTHONPATH=src python -m storage.yahoo_ingest \
              --db data/market/market_data.sqlite \
              --universe config/universe.yaml \
              --benchmark SPY \
              --range 2y \
              --interval 1d \
              --sleep-seconds 0.4
          fi

          symbols=$(PYTHONPATH=src python -c "from pathlib import Path; from floor.universe import parse_universe_yaml; print(','.join(sorted(set(parse_universe_yaml(Path('config/universe.yaml')) + ['SPY']))))")
          if ! PYTHONPATH=src python -m utils.market_data_guard \
            --db data/market/market_data.sqlite \
            --symbols "$symbols" \
            --max-stale-sessions 0 \
            --required-session "${{ needs.gate.outputs.required_market_session }}"; then
            echo "::warning::Market DB is stale for the accepted checkpoint; refreshing recent daily bars once."
            PYTHONPATH=src python -m storage.yahoo_ingest \
              --db data/market/market_data.sqlite \
              --universe config/universe.yaml \
              --benchmark SPY \
              --range 5d \
              --interval 1d \
              --sleep-seconds 0.15
          fi

          PYTHONPATH=src python -m utils.market_data_guard \
            --db data/market/market_data.sqlite \
            --symbols "$symbols" \
            --max-stale-sessions 0 \
            --required-session "${{ needs.gate.outputs.required_market_session }}"

      - name: Validate champion artifacts
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          for champion in \
            data/training/models/d1_champion.json \
            data/training/models/w1_champion.json \
            data/training/models/q1_champion.json \
            data/training/models/value_champion.json \
            data/training/models/timing_champion.json; do
            test -s "$champion" || { echo "::error::Missing champion artifact: $champion"; exit 1; }
            if head -c 120 "$champion" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
              echo "::error::Champion is an unresolved LFS pointer: $champion"
              exit 1
            fi
          done

      - name: Capture baseline counters
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p data/logs
          PYTHONPATH=src python -m utils.workflow_validations capture-baseline \
            --db data/persistence/app.sqlite \
            --data-dir data \
            --streams predictions,signals \
            --output-file data/logs/baseline.env \
            | tee data/logs/intraday_baseline.json

      - name: Run canonical intraday engine with retries
        if: steps.lock_guard.outputs.run == 'true'
        env:
          LIVE_TRADING_ENABLED: "false"
          GOOGLE_SHEETS_RECOMMENDATIONS_CSV_URL: ${{ secrets.GOOGLE_SHEETS_RECOMMENDATIONS_CSV_URL }}
        run: |
          set -euo pipefail
          mkdir -p data/logs
          success=false
          for i in 1 2 3; do
            logfile="data/logs/intraday_engine_${{ needs.gate.outputs.event }}_attempt${i}.log"
            if PYTHONPATH=src python -m floor.main run-cycle \
              --event "${{ needs.gate.outputs.event }}" \
              --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
              --required-market-session "${{ needs.gate.outputs.required_market_session }}" \
              2>&1 | tee "$logfile"; then
              success=true
              break
            fi
            tail -n 120 "$logfile" || true
            sleep $((i*30))
          done
          [ "$success" = true ] || { echo "::error::Intraday engine failed after 3 attempts"; exit 1; }

      - name: Validate generated state
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -s data/reports/dashboard.json
          sqlite3 data/persistence/app.sqlite "PRAGMA quick_check;" | grep -qx ok
          PYTHONPATH=src python -m utils.workflow_validations validate-latest-payload \
            --data-dir data \
            --stream predictions \
            --required-fields model_version
          PYTHONPATH=src python -m utils.workflow_validations validate-prediction-quality \
            --data-dir data \
            --stream predictions \
            --max-m3-blocked-ratio 0.4 \
            --min-action-consistency-ratio 0.7 \
            --action-return-tolerance 0.0 \
            --sample-limit 10

      - name: Mark checkpoint complete
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m utils.workflow_guards mark \
            --kind intraday \
            --event "${{ needs.gate.outputs.event }}" \
            --session-day "${{ needs.gate.outputs.session_day }}" \
            --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
            --data-dir data

      - name: Build compact immutable per-run audit
        if: steps.lock_guard.outputs.run == 'true'
        run: |
          PYTHONPATH=src python -m utils.intraday_audit \
            --data-dir data \
            --output-dir "${{ runner.temp }}/intraday-audit" \
            --batch-id "${{ needs.gate.outputs.session_day }}:${{ needs.gate.outputs.event }}" \
            --event "${{ needs.gate.outputs.event }}" \
            --session-day "${{ needs.gate.outputs.session_day }}" \
            --checkpoint-at "${{ needs.gate.outputs.checkpoint_at }}" \
            --required-market-session "${{ needs.gate.outputs.required_market_session }}" \
            --run-id "${{ github.run_id }}" \
            --source-sha "${{ github.sha }}"

      - name: Publish rolling runtime state outside Git
        if: steps.lock_guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_STATE_CHECKPOINT_AT: ${{ needs.gate.outputs.checkpoint_at }}
          RUNTIME_STATE_CHECKPOINT_EVENT: ${{ needs.gate.outputs.event }}
        run: bash scripts/runtime_state.sh publish

      - name: Publish lightweight checkpoint index
        if: steps.lock_guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checkpoint_state.sh publish

      - name: Repair lightweight checkpoint index after duplicate suppression
        if: steps.lock_guard.outputs.run != 'true' && steps.lock_guard.outputs.reason == 'already_ran'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checkpoint_state.sh publish

      - name: Upload immutable per-run audit artifact
        if: steps.lock_guard.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intraday-audit-${{ github.run_id }}-${{ needs.gate.outputs.event }}
          path: ${{ runner.temp }}/intraday-audit
          if-no-files-found: error
          retention-days: 30

      - name: Report duplicate checkpoint suppression
        if: steps.lock_guard.outputs.run != 'true'
        run: |
          echo "Intraday run suppressed after lock revalidation."
          echo "original_event=${{ needs.gate.outputs.event }}"
          echo "revalidated_event=${{ steps.lock_guard.outputs.event }}"
          echo "revalidated_reason=${{ steps.lock_guard.outputs.reason }}"
          echo "revalidated_checkpoint_at=${{ steps.lock_guard.outputs.checkpoint_at }}"
          echo "required_market_session=${{ steps.lock_guard.outputs.required_market_session }}"

  engine_info:
    needs: [gate, engine_critical]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Emit decision
        run: |
          echo "run=${{ needs.gate.outputs.run }}"
          echo "event=${{ needs.gate.outputs.event }}"
          echo "reason=${{ needs.gate.outputs.reason }}"
          echo "checkpoint_at=${{ needs.gate.outputs.checkpoint_at }}"
          echo "lateness_minutes=${{ needs.gate.outputs.lateness_minutes }}"
          echo "required_market_session=${{ needs.gate.outputs.required_market_session }}"
          echo "runtime_state=github_release:runtime-state-v1"
          echo "checkpoint_state=github_release:checkpoint-state-v1"
          echo "git_operational_writes=disabled"
          if [ "${{ needs.gate.outputs.reason }}" = "checkpoint_missed" ]; then
            echo "::error::A market checkpoint was missed outside the allowed lateness window."
            exit 1
          fi
