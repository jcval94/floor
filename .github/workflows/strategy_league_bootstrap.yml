name: strategy_league_bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_league_id:
        description: "Type the exact league_id to authorize a one-time frozen Weekly bootstrap"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'config/strategy_league_genesis_request.json'

permissions:
  contents: write
  actions: read

jobs:
  bootstrap:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install modeling dependencies
        run: python -m pip install -e ".[modeling]"

      - name: Resolve and confirm explicit league genesis
        id: contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LEAGUE_ID: ${{ github.event.inputs.confirm_league_id }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          from pathlib import Path

          cfg = json.loads(Path("config/strategy_league.json").read_text(encoding="utf-8"))
          league_id = str(cfg["league_id"])
          model_path = str(cfg["weekly_model_path"])
          event_name = os.environ.get("EVENT_NAME", "")

          epochs = json.loads(
              Path("config/strategy_league_epochs.json").read_text(encoding="utf-8")
          )
          if str(epochs.get("current_league_id") or "") != league_id:
              raise SystemExit(
                  "Bootstrap refused: strategy_league_epochs current_league_id "
                  f"does not match league_id={league_id!r}"
              )
          epoch = next(
              (
                  item
                  for item in epochs.get("epochs", [])
                  if str(item.get("league_id") or "") == league_id
              ),
              None,
          )
          if not isinstance(epoch, dict):
              raise SystemExit(f"Bootstrap refused: current epoch {league_id!r} is not declared")
          expected_freeze_id = str(epoch.get("freeze_id") or "")
          if not expected_freeze_id:
              raise SystemExit("Bootstrap refused: current epoch has no freeze_id")

          if f"/{league_id}/" not in model_path:
              raise SystemExit(
                  "Bootstrap refused: weekly_model_path must be namespaced by current league_id"
              )

          freeze_matches = []
          for freeze_path in sorted(Path("config/frozen").glob("capital_challenger*.json")):
              payload = json.loads(freeze_path.read_text(encoding="utf-8"))
              if str(payload.get("freeze_id") or "") == expected_freeze_id:
                  freeze_matches.append((freeze_path, payload))
          if len(freeze_matches) != 1:
              raise SystemExit(
                  "Bootstrap refused: expected exactly one frozen challenger manifest for "
                  f"freeze_id={expected_freeze_id!r}, found={len(freeze_matches)}"
              )
          freeze_path, freeze = freeze_matches[0]
          if str(freeze.get("source_league_id") or "") != league_id:
              raise SystemExit("Bootstrap refused: frozen challenger source_league_id mismatch")
          challenger = cfg.get("capital_allocation_challenger")
          if freeze.get("challenger_config") != challenger:
              raise SystemExit("Bootstrap refused: current challenger config differs from freeze")
          canonical = json.dumps(
              challenger, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          )
          actual_challenger_sha = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          if actual_challenger_sha != str(freeze.get("challenger_config_sha256") or ""):
              raise SystemExit("Bootstrap refused: frozen challenger hash is inconsistent")

          if event_name == "push":
              request = json.loads(
                  Path("config/strategy_league_genesis_request.json").read_text(encoding="utf-8")
              )
              if request.get("action") != "BOOTSTRAP_CLEAN_GENESIS":
                  raise SystemExit("Bootstrap refused: genesis request action is not BOOTSTRAP_CLEAN_GENESIS")
              confirmation = str(request.get("league_id") or "")
              if str(request.get("freeze_id") or "") != expected_freeze_id:
                  raise SystemExit(
                      "Bootstrap refused: genesis request freeze_id does not match current epoch"
                  )
          else:
              confirmation = os.environ.get("INPUT_LEAGUE_ID", "")

          if confirmation != league_id:
              raise SystemExit(
                  f"Bootstrap refused: confirmation must exactly match league_id={league_id!r}"
              )

          state_path = f"data/metrics/strategy_league/runs/{league_id}/state.json"
          print(f"league_id={league_id}")
          print(f"model_path={model_path}")
          print(f"state_path={state_path}")
          print(f"freeze_path={freeze_path}")
          print(f"freeze_id={expected_freeze_id}")
          PY

      - name: Acquire runtime writer lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_writer_lock.sh acquire

      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore

      - name: Check clean-genesis preconditions
        id: challenger
        env:
          MODEL: ${{ steps.contract.outputs.model_path }}
          STATE: ${{ steps.contract.outputs.state_path }}
        run: |
          set -euo pipefail
          if [ -s "$STATE" ] && [ ! -s "$MODEL" ]; then
            echo "::error::Current league already has state but its frozen Weekly artifact is missing. Refusing to reconstruct history."
            exit 1
          fi
          if [ -s "$MODEL" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frozen challenger already exists for this league; bootstrap skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize DB schemas
        if: steps.challenger.outputs.exists != 'true'
        run: make init-db-schemas

      - name: Ensure enough local history for one-time bootstrap
        if: steps.challenger.outputs.exists != 'true'
        run: |
          set -euo pipefail
          if ! PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol 80 \
            --max-age-days 7; then
            echo "Retained history is insufficient; refreshing 2y once for bootstrap."
            PYTHONPATH=src python -m storage.yahoo_ingest \
              --db data/market/market_data.sqlite \
              --universe config/universe.yaml \
              --benchmark SPY \
              --range 2y \
              --interval 1d \
              --sleep-seconds 0.2
          fi

      - name: Build local-only bootstrap dataset
        if: steps.challenger.outputs.exists != 'true'
        run: |
          set -euo pipefail
          rm -rf data/metrics/strategy_league/bootstrap
          mkdir -p data/metrics/strategy_league/bootstrap
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --output data/metrics/strategy_league/bootstrap/market_rows.jsonl
          PYTHONPATH=src python -m features.run_features \
            --input data/metrics/strategy_league/bootstrap/market_rows.jsonl \
            --output data/metrics/strategy_league/bootstrap/modelable_dataset.json

      - name: Train only Weekly Opportunity challenger
        if: steps.challenger.outputs.exists != 'true'
        env:
          MODEL: ${{ steps.contract.outputs.model_path }}
          LEAGUE_ID: ${{ steps.contract.outputs.league_id }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL")"
          VERSION="${LEAGUE_ID}-weekly-$(date -u +%Y%m%dT%H%M%SZ)"
          PYTHONPATH=src python -m league.bootstrap_weekly_model \
            --dataset data/metrics/strategy_league/bootstrap/modelable_dataset.json \
            --output "$MODEL" \
            --version "$VERSION"

      - name: Remove temporary bootstrap rows
        if: always() && steps.challenger.outputs.exists != 'true'
        run: rm -rf data/metrics/strategy_league/bootstrap

      - name: Publish compact runtime state
        if: steps.challenger.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh publish

      - name: Upload frozen challenger for audit
        if: steps.challenger.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-league-weekly-model-${{ steps.contract.outputs.league_id }}-${{ github.run_id }}
          path: ${{ steps.contract.outputs.model_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Release runtime writer lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_writer_lock.sh release

      - name: Summary
        run: |
          {
            echo "## Strategy League clean genesis"
            echo "- League: ${{ steps.contract.outputs.league_id }}"
            echo "- Challenger already existed: ${{ steps.challenger.outputs.exists }}"
            echo "- Model path: ${{ steps.contract.outputs.model_path }}"
            echo "- Freeze: ${{ steps.contract.outputs.freeze_id }} (${{ steps.contract.outputs.freeze_path }})"
            echo "- Trigger: explicit dispatch or committed genesis request."
            echo "- Prospective history starts only on the first complete EOD for this league."
            echo "- Operational PAPER gateway: disabled"
            echo "- LIVE execution: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
