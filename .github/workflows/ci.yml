name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install mypy pyyaml

      - name: Lint
        run: |
          ruff check src tests scripts

      - name: Type check
        run: |
          mypy --ignore-missing-imports src

      - name: Unit and integration tests
        run: |
          pytest -q

      - name: Smoke tests end-to-end
        run: |
          python scripts/validate_repo.py --smoke

      - name: Dry-run audited GitHub Pages build
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pages-site"
          cp -R site "$RUNNER_TEMP/pages-site"
          PYTHONPATH=src python -m utils.pages_publish \
            --data-dir data \
            --site-data-dir "$RUNNER_TEMP/pages-site/data" \
            --universe-path config/universe.yaml \
            --source-commit "${GITHUB_SHA}"
          PYTHONPATH=src python -m utils.pages_security \
            --site-dir "$RUNNER_TEMP/pages-site"
          PYTHONPATH=src python -m utils.pages_publish \
            --site-data-dir "$RUNNER_TEMP/pages-site/data" \
            --validate-only
          PYTHONPATH=src python -m utils.pages_security \
            --site-dir "$RUNNER_TEMP/pages-site" \
            --validate-only
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'pages-site' / 'data'
          audit = json.loads((root / 'audit.json').read_text(encoding='utf-8'))
          forecasts = json.loads((root / 'forecasts.json').read_text(encoding='utf-8'))
          assert audit['safe_to_deploy'] is True
          if audit['publishable_forecasts']:
              assert len(forecasts['rows']) == audit['expected_prediction_rows']
          else:
              assert forecasts['rows'] == []
          print('pages_dry_run_status=', audit['status'])
          print('pages_publishable_forecasts=', audit['publishable_forecasts'])
          print('pages_blockers=', audit.get('blockers', []))
          PY

      - name: Enforce minimum coverage
        run: |
          pytest -q --cov=src --cov-report=term-missing --cov-fail-under=60

      - name: Validate repo quality gates
        run: |
          python scripts/validate_repo.py
