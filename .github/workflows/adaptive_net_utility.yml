name: adaptive_net_utility

on:
  workflow_dispatch:
  push:
    branches:
      - feat/adaptive-net-utility-v1
    paths:
      - ".github/workflows/adaptive_net_utility.yml"
      - "src/models/adaptive_net_utility.py"
      - "tests/test_adaptive_net_utility.py"
      - "src/models/robust_range_v3.py"
      - "src/models/train_weekly_opportunity.py"
      - "src/models/temporal_cv.py"

permissions:
  contents: write

concurrency:
  group: adaptive-net-utility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install modeling dependencies
        run: python -m pip install -e '.[dev]'

      - name: Rebuild five-year point-in-time dataset
        run: |
          set -euo pipefail
          make init-dbs
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range 5y \
            --interval 1d \
            --sleep-seconds 0.15
          PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol 250 \
            --max-age-days 7
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --output data/training/yahoo_market_rows.jsonl
          PYTHONPATH=src python -m features.run_features \
            --input data/training/yahoo_market_rows.jsonl \
            --output data/training/modelable_dataset.json \
            --validation-days 75 \
            --test-days 76

      - name: Train nonlinear utility challenger and open sealed test once
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive
          PYTHONPATH=src python -m models.adaptive_net_utility \
            --dataset data/training/modelable_dataset.json \
            --output artifacts/adaptive/adaptive_net_utility_audit.json \
            --version "adaptive-net-utility-${GITHUB_RUN_ID}"

      - name: Verify model unit and temporal contracts
        run: python -m pytest -q tests/test_adaptive_net_utility.py tests/test_strategy_package_structure.py

      - name: Publish comparison summary
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/adaptive/adaptive_net_utility_audit.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print("## Adaptive Net Utility v1")
          print("")
          print("Nonlinear HGB return model + cost-aware tail selection. Test was not used for selection.")
          print("")
          print("| Split | Candidate net/trade | Ridge net/trade | Momentum net/trade | Candidate hit | Trades | Dominates |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for split in ("validation", "blind_test"):
              block = report["metrics"][split]
              a = block["adaptive"]
              r = block["weekly_ridge"]
              m = block["momentum_20"]
              print(
                  f"| {split} | {100*a['mean_net_return']:.3f}% | "
                  f"{100*r['mean_net_return']:.3f}% | "
                  f"{100*m['mean_net_return']:.3f}% | "
                  f"{100*a['hit_rate']:.2f}% | {a['trades']} | "
                  f"{block['dominates_baselines']} |"
              )
          print("")
          print(f"Promotion ready for strategy replay: `{report['promotion_ready_for_strategy_replay']}`")
          print("Round-trip cost charged: `58 bps`")
          print("Blind test used for selection: `false`")
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open("artifacts/adaptive/adaptive_net_utility_audit.json", encoding="utf-8"))
          print("promotion_ready=" + str(report["promotion_ready_for_strategy_replay"]).lower())
          PY

      - name: Persist winning challenger on experiment branch
        if: steps.summary.outputs.promotion_ready == 'true' && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p data/metrics/strategy_research/models
          cp artifacts/adaptive/adaptive_net_utility_audit.json \
            data/metrics/strategy_research/models/adaptive_net_utility_challenger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics/strategy_research/models/adaptive_net_utility_challenger.json
          if git diff --cached --quiet; then
            echo "No challenger artifact change to persist"
          else
            git commit -m "research: persist adaptive utility winning challenger [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload immutable audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-net-utility-${{ github.run_id }}
          path: artifacts/adaptive
          if-no-files-found: error
          retention-days: 30

      - name: Enforce promotion gate
        if: steps.summary.outputs.promotion_ready != 'true'
        run: |
          echo "::error::Adaptive Net Utility did not beat both Ridge and momentum on validation and sealed test."
          exit 1
