name: ingest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest_critical:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: floor-runtime-state-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore rolling runtime state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh restore
      - name: Initialize market DB
        run: make init-dbs
      - name: Capture decision-state fingerprint before ingest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          roots = [Path('data/predictions'), Path('data/signals'), Path('data/orders')]
          snapshot = {}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  snapshot[path.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          out = Path(os.environ['RUNNER_TEMP']) / 'ingest_decision_before.json'
          out.write_text(json.dumps(snapshot, sort_keys=True), encoding='utf-8')
          print(f'decision_files_before={len(snapshot)}')
          PY
      - name: Refresh market DB from Yahoo
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range 2y \
            --interval 1d \
            --sleep-seconds 0.4
      - name: Validate market data populated
        run: |
          set -euo pipefail
          rows=$(sqlite3 data/market/market_data.sqlite "SELECT COUNT(*) FROM daily_bars;")
          [ "${rows:-0}" -gt 0 ] || { echo "::error::Yahoo ingest completed without market rows."; exit 1; }
          echo "market_rows=$rows"
      - name: Assert ingest does not mutate decisions
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          before_path = Path(os.environ['RUNNER_TEMP']) / 'ingest_decision_before.json'
          before = json.loads(before_path.read_text(encoding='utf-8'))
          roots = [Path('data/predictions'), Path('data/signals'), Path('data/orders')]
          after = {}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  after[path.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          if before != after:
              before_keys = set(before)
              after_keys = set(after)
              changed = sorted(k for k in before_keys & after_keys if before[k] != after[k])
              added = sorted(after_keys - before_keys)
              removed = sorted(before_keys - after_keys)
              raise SystemExit(
                  f'Ingest mutated decision state: added={added[:10]} removed={removed[:10]} changed={changed[:10]}'
              )
          print(f'decision_files_unchanged={len(after)}')
          PY
      - name: Publish refreshed market state outside Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/runtime_state.sh publish
      - name: Upload refreshed market DB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ingest-market-db-${{ github.run_id }}
          path: data/market/market_data.sqlite
          if-no-files-found: error
          retention-days: 14
