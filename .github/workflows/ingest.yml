name: ingest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest_critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Initialize market DB
        run: make init-dbs

      - name: Refresh market DB from Yahoo
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range 2y \
            --interval 1d \
            --sleep-seconds 0.4

      - name: Validate market data populated
        run: |
          set -euo pipefail
          rows=$(sqlite3 data/market/market_data.sqlite "SELECT COUNT(*) FROM daily_bars;")
          if [ "${rows:-0}" -le 0 ]; then
            echo "::error::Yahoo ingest completed without market rows."
            exit 1
          fi
          echo "market_rows=$rows"

      - name: Assert ingest does not mutate decisions
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/predictions data/signals data/orders; then
            echo "::error::Ingest preflight mutated prediction, signal, or order artifacts."
            git diff -- data/predictions data/signals data/orders
            exit 1
          fi

      - name: Upload refreshed market DB
        uses: actions/upload-artifact@v4
        with:
          name: ingest-market-db
          path: data/market/market_data.sqlite
          if-no-files-found: error
