name: dispatch-history-compaction-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch_history_compaction_once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected manual compaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run manual_compact_git_history.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f confirm=PURGE_GENERATED_DATA_HISTORY
          echo "Dispatched manual_compact_git_history as workflow_dispatch."
