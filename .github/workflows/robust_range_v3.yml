name: robust_range_v3

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/robust_range_v3.yml"
      - "pyproject.toml"
      - "src/features/**"
      - "src/models/**"
      - "src/contracts/model_contract.py"
      - "config/model_contracts.json"
      - "src/forecasting/parity_models.py"
      - "tests/test_robust_range_v3.py"
      - "tests/test_classic_champion_gate.py"
      - "tests/test_p0_contracts.py"
  push:
    branches:
      - feat/differential-range-v3
    paths:
      - ".github/workflows/robust_range_v3.yml"
      - "pyproject.toml"
      - "src/features/**"
      - "src/models/**"
      - "src/forecasting/parity_models.py"
      - "tests/test_robust_range_v3.py"
      - "tests/test_classic_champion_gate.py"

permissions:
  contents: read

concurrency:
  group: robust-range-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Rebuild five-year point-in-time dataset
        run: |
          set -euo pipefail
          make init-dbs
          PYTHONPATH=src python -m storage.yahoo_ingest \
            --db data/market/market_data.sqlite \
            --range 5y \
            --interval 1d \
            --sleep-seconds 0.15
          PYTHONPATH=src python -m utils.training_data_guard \
            --db data/market/market_data.sqlite \
            --universe config/universe.yaml \
            --benchmark SPY \
            --min-rows-per-symbol 250 \
            --max-age-days 7
          PYTHONPATH=src python -m features.build_training_from_db \
            --db data/market/market_data.sqlite \
            --output data/training/yahoo_market_rows.jsonl
          PYTHONPATH=src python -m features.run_features \
            --input data/training/yahoo_market_rows.jsonl \
            --output data/training/modelable_dataset.json \
            --validation-days 75 \
            --test-days 76

      - name: Determine whether strict promotion dominance is required
        id: promotion_gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "require_dominance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}"
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          printf '%s\n' "$changed"
          require=false
          while IFS= read -r path; do
            case "$path" in
              src/features/*|src/models/robust_range_v3.py|src/models/classic_horizon_predictor.py)
                # These paths can directly change the central range predictor
                # or its feature values, so a PR touching them must prove
                # strict statistical dominance before the audit passes.
                require=true
                ;;
              src/models/train_classic_horizons.py|src/models/classic_champion_gate.py|src/models/evaluate_range_v3.py)
                # Trainer/gate/audit orchestration changes still execute the
                # full governed comparison, but do not have to fabricate a
                # central-MAE improvement when the predictor itself is
                # unchanged. Manual promotion runs remain strict.
                ;;
            esac
          done <<< "$changed"
          echo "require_dominance=$require" >> "$GITHUB_OUTPUT"

      - name: Train conservative robust challenger
        run: |
          set -euo pipefail
          mkdir -p artifacts/baseline artifacts/candidate artifacts/audit
          git fetch --no-tags --depth=1 origin main
          BASELINE_SHA="$(git rev-parse FETCH_HEAD)"
          for horizon in d1 w1 q1; do
            git show "${BASELINE_SHA}:data/training/models/${horizon}_champion.json" \
              > "artifacts/baseline/${horizon}_champion.json"
          done

          mkdir -p artifacts/migration
          PYTHONPATH=src python -m models.migrate_classic_contracts \
            --dataset data/training/modelable_dataset.json \
            --registry-dir artifacts/baseline \
            --output-dir artifacts/migration \
            --version "classic-contract-${GITHUB_RUN_ID}" \
            --tasks d1,w1,q1

          PYTHONPATH=src python -m models.train_classic_horizons \
            --dataset data/training/modelable_dataset.json \
            --output-dir artifacts/candidate \
            --version "robust-range-v3-${GITHUB_RUN_ID}" \
            --tasks d1,w1,q1 \
            --training-mode manual \
            --families robust_range_v3
          PYTHONPATH=src python -m models.classic_champion_gate \
            --dataset data/training/modelable_dataset.json \
            --registry-dir artifacts/candidate \
            --previous-dir artifacts/baseline \
            --tasks d1,w1,q1 \
            --version "robust-range-v3-${GITHUB_RUN_ID}"

      - name: Audit validation and sealed-test dominance
        run: |
          set -euo pipefail
          args=(
            --dataset data/training/modelable_dataset.json
            --baseline-dir artifacts/baseline
            --candidate-dir artifacts/candidate
            --output artifacts/audit/robust_range_v3_audit.json
          )
          if [ "${{ steps.promotion_gate.outputs.require_dominance }}" = "true" ]; then
            args+=(--require-dominance)
          else
            echo "Strict promotion dominance is informational for this PR because robust-range training/features did not change."
          fi
          PYTHONPATH=src python -m models.evaluate_range_v3 "${args[@]}"

      - name: Verify train-serve and temporal contracts
        run: |
          python -m pytest -q \
            tests/test_robust_range_v3.py \
            tests/test_classic_champion_gate.py \
            tests/test_train_classic_horizons.py \
            tests/test_train_serve_parity_and_risk_gateway.py \
            tests/test_p0_contracts.py \
            tests/test_features.py

      - name: Publish model audit summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/audit/robust_range_v3_audit.json").read_text()
          )
          print("## robust_range_v3")
          print("")
          print("| Horizon | Split | Floor MAE | Ceiling MAE | Spread MAE | Coverage Δ |")
          print("|---|---:|---:|---:|---:|---:|")
          for horizon, payload in report["horizons"].items():
              for split in ("validation", "blind_test"):
                  result = payload[split]
                  gains = result["relative_improvement"]
                  print(
                      f"| {horizon} | {split} | "
                      f"{100 * gains['mae_floor_pct']:.2f}% | "
                      f"{100 * gains['mae_ceiling_pct']:.2f}% | "
                      f"{100 * gains['mae_spread_pct']:.2f}% | "
                      f"{100 * result['interval_coverage_delta']:.2f} pp |"
                  )
          print("")
          print(f"Promotion ready: `{report['promotion_ready']}`")
          print("Test used for selection: `false`")
          print("")
          migration = json.loads(
              Path("artifacts/migration/migration_report.json").read_text()
          )
          print("## Existing champion contract migration")
          print("")
          print(f"Migration ready: `{migration['ready']}`")
          for item in migration["reports"]:
              risk = item["risk_metrics"]
              print(
                  f"- {item['horizon']}: {item['status']} "
                  f"(floor={100*risk['risk_floor_coverage']:.1f}%, "
                  f"ceiling={100*risk['risk_ceiling_coverage']:.1f}%)"
              )
          PY

      - name: Upload compact champions and audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robust-range-v3-${{ github.run_id }}
          path: |
            artifacts/candidate
            artifacts/migration
            artifacts/audit
          if-no-files-found: error
          retention-days: 30
